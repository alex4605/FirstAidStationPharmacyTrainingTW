<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="還開著 STILL OPEN——戰時急救站藥師（EMT-2）值班模擬訓練。">
<meta name="theme-color" content="#0b0e0f">
<title>還開著 STILL OPEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/narrow.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand"><b>還開著</b><span>STILL OPEN</span><i>藥師・EMT-2</i></div>
    <div class="clock"><small>第四天</small><span id="clock">08:00</span></div>
    <div class="spd" role="group" aria-label="時間速度">
      <button id="sp0" aria-pressed="false">▮▮</button><button id="sp1" aria-pressed="true">×1</button>
      <button id="sp2" aria-pressed="false">×2</button><button id="sp4" aria-pressed="false">×4</button>
      <button id="sp8" aria-pressed="false">×8</button>
    </div>
    <div class="gauge"><label>冷鏈</label><b id="g-fridge">4.0℃</b></div>
    <div class="gauge"><label>發電機油</label><b id="g-fuel">180L</b></div>
    <div class="gauge"><label>曝光</label><div class="dots" id="expodots"><i></i><i></i><i></i><i></i></div></div>
    <div class="gauge"><label>待處理</label><b id="g-queue">0</b></div>
    <div class="topspacer"></div>
    <button class="tbtn q" id="btn-bench">回調劑檯</button>
    <button class="tbtn only-m" id="btn-more" aria-pressed="false" title="更多">⋯</button>
    <span id="moreset">
      <button class="tbtn seed" id="btn-seed" title="這一場的亂數種子。同一個種子會生出完全相同的幫手、事件與時序——教官可以讓整班跑同一場。點一下複製連結。">種子 <b id="seedv">—</b></button>
      <button class="tbtn" id="btn-auto" aria-pressed="true"><span class="lg">新事件</span>自動暫停</button>
      <button class="tbtn" id="btn-doc">設計文件<span class="lg"> v1.9</span></button>
      <button class="tbtn" id="btn-aar">結束白班<span class="lg">（20:00）</span></button>
    </span>
  </div>
  <nav id="tabs" role="tablist">
    <button data-tab="work" aria-pressed="true">工作<b id="tb-work">0</b></button>
    <button data-tab="act" aria-pressed="false">處置<i id="tb-dot"></i></button>
    <button data-tab="stock" aria-pressed="false">藥品<b id="tb-stock"></b></button>
    <button data-tab="log" aria-pressed="false">紀錄</button>
  </nav>
  <div id="main">
    <div class="col" id="left"><div class="scroll">
      <div class="sec"><h3>工作佇列 <em id="qmeta">0 項待處理</em></h3>
        <div id="qfilter"></div>
        <div class="jobs" id="joblist"></div></div>
      <div class="sec"><h3>站內幫手 <em id="hmeta">尚無</em></h3><div id="helpers"></div></div>
    </div></div>
    <div id="stage">
      <canvas id="scene"></canvas>
      <div class="hud" id="hud-fridge">冷藏庫<b>4.0℃</b><span id="fridge-sub">Insulin 2 · TT 350</span></div>
      <div class="hud" id="hud-place">藥局・調劑作業區 4 坪<br><b id="hud-zone">你在調劑檯前</b></div>
      <div id="speech" hidden><span class="sp-who" id="sp-who"></span><span class="sp-tx" id="sp-tx"></span></div>
      <div class="hud" id="hud-help">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動　<kbd>Q</kbd><kbd>E</kbd> 轉視角　<kbd>V</kbd> 拉遠／拉近<br>
        調劑必須在藥局內完成　<kbd>空白鍵</kbd> 暫停
      </div>
      <div id="dpad">
        <button data-d="q">↺</button><button data-d="w">▲</button><button data-d="e">↻</button>
        <button data-d="a">◀</button><button data-d="s">▼</button><button data-d="d">▶</button>
      </div>
    </div>
    <div class="col" id="right"><div class="scroll" id="detail"></div></div>
    <div class="col" id="stock">
      <button id="stock-rail" title="展開／收合藥品架" aria-expanded="true">
        <span class="rl">藥品架與冰箱</span><span class="rn" id="stock-badge">55</span></button>
      <div class="stockbody">
        <div class="stockhead">
          <div class="sh1"><b>藥品架與冰箱</b><em id="stockmeta">7 日儲備</em></div>
          <input type="text" id="stock-find" placeholder="搜尋品項、分類或劑型…" autocomplete="off">
          <div class="shrow"><button class="sbtn" id="stock-all">全部展開</button>
            <button class="sbtn" id="stock-none">全部收合</button>
            <label class="slow"><input type="checkbox" id="stock-lowonly"> 只看低於三成</label></div>
        </div>
        <div class="scroll" id="shelf"></div>
      </div>
    </div>
  </div>
  <div id="bgbar"></div>
  <div id="log"></div>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script src="vendor/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/data/drugs.js"></script>
<script src="js/data/people.js"></script>
<script src="js/data/jobs.js"></script>
<script src="js/data/helpers.js"></script>
<script src="js/data/support.js"></script>
<script src="js/data/field.js"></script>
<script src="js/data/rx-bank.js"></script>
<script src="js/scenario.js"></script>
<script src="js/game/state.js"></script>
<script src="js/game/dispense.js"></script>
<script src="js/game/station.js"></script>
<script src="js/game/helpers.js"></script>
<script src="js/game/events.js"></script>
<script src="js/game/loop.js"></script>
<script src="js/game/ending.js"></script>
<script src="js/ui/docs.js"></script>
<script src="js/scene3d.js"></script>
<script src="js/ui/rx-paper.js"></script>
<script src="js/ui/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
