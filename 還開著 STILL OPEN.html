<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>還開著 STILL OPEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* 還開著 STILL OPEN — v1.8 藥師視角（EMT-2）
   昏暗的地下避難室裡只有調劑檯那盞暖白工作燈是亮的。
   琥珀＝你的作業面／冷青＝冷鏈／紫紅＝管制藥品／各工作類型有自己的色條。 */
:root{
  --ground:#0b0e0f; --panel:#13181a; --panel-2:#191f22; --panel-3:#20272a;
  --line:#283236; --line-hi:#3b484d;
  --ink:#e4e1d8; --ink-dim:#9aa39f; --ink-faint:#68736f;
  --amber:#d99a3c; --amber-hi:#f0b95c; --amber-dim:#8a6528;
  --cold:#4fa8b8; --ctrl:#b8586b;
  --k-rx:#d99a3c; --k-con:#7f9fd6; --k-edu:#5fbfa8; --k-emt:#c6362f;
  --k-ass:#b3a17a; --k-cbr:#b07fd6; --k-help:#8fbf7f; --k-logi:#8a9b6b; --k-lang:#d9a06b;
  --k-crowd:#d97f8a; --k-idn:#7fc2d9;
  --t1:#c6362f; --t2:#d9a521; --t3:#3e8e5a; --t4:#5a6266;
  --ok:#4f9268; --warn:#d9873a; --bad:#c6362f;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC",Georgia,serif;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:13px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:rgba(224,168,74,.18)}
button:active{filter:brightness(1.25)}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber-hi);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:#0e1214}
::-webkit-scrollbar-thumb{background:#2b3539}::-webkit-scrollbar-thumb:hover{background:var(--line-hi)}

#app{display:grid;height:100%;grid-template-rows:auto 1fr auto}
#topbar{display:flex;align-items:center;gap:15px;flex-wrap:wrap;padding:8px 16px;
  background:linear-gradient(180deg,#171d20,#12171a);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.08em}
.brand span{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);letter-spacing:.2em}
.brand i{font-style:normal;font-size:9.5px;color:var(--amber);letter-spacing:.12em;border:1px solid var(--amber-dim);padding:1px 6px}
.clock{font-family:var(--mono);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.clock small{font-size:9.5px;color:var(--ink-faint);font-weight:400;letter-spacing:.12em;margin-right:7px}
.spd{display:flex;border:1px solid var(--line)}
.spd button{background:transparent;border:0;padding:3px 8px;color:var(--ink-dim);font-family:var(--mono);font-size:11px}
.spd button[aria-pressed="true"]{background:var(--amber);color:#181004;font-weight:700}
.gauge{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.gauge label{font-family:var(--sans);font-size:9.5px;letter-spacing:.14em;color:var(--ink-faint)}
.gauge b{color:var(--cold);font-weight:700}
.gauge b.hot{color:var(--warn)} .gauge b.crit{color:var(--bad)}
.dots{display:flex;gap:3px}.dots i{width:14px;height:5px;background:#222b2e;display:block}
.dots i.on{background:var(--warn)}.dots i.on.s4{background:var(--bad)}
.topspacer{flex:1}
.tbtn{background:#181e21;border:1px solid var(--line);padding:4px 10px;color:var(--ink-dim)}
.tbtn:hover{border-color:var(--amber);color:var(--amber-hi)}
.tbtn.q{border-color:var(--amber-dim);color:var(--amber)}
.tbtn.seed{font-family:var(--mono);font-size:10px;letter-spacing:.06em}
.tbtn.seed b{color:var(--amber);font-weight:700;letter-spacing:.14em}
.tbtn[aria-pressed="true"]{background:var(--amber-dim);color:#f6e6c8;border-color:var(--amber)}

#main{display:grid;grid-template-columns:344px 1fr 356px auto;min-height:0}
.col{min-height:0;display:flex;flex-direction:column;background:var(--panel)}
#left{border-right:1px solid var(--line)} #right{border-left:1px solid var(--line)}
#stage{position:relative;min-width:0;background:#06080a;overflow:hidden}
#scene{display:block;width:100%;height:100%}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 70% at 50% 47%,transparent 36%,rgba(4,6,7,.74) 100%)}
.scroll{overflow-y:auto;overflow-x:hidden;min-height:0;flex:1}
.sec>h3{margin:0;padding:7px 12px 6px;font-size:9.5px;font-weight:700;letter-spacing:.2em;
  color:var(--ink-faint);background:var(--panel-2);border-block:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
.sec>h3 em{font-style:normal;letter-spacing:.04em;font-family:var(--mono);color:var(--ink-dim)}
.sec>h3 em.hot{color:var(--warn)}

/* 工作佇列 */
#qfilter{display:flex;flex-wrap:wrap;gap:3px;padding:6px 8px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:26px;z-index:2}
.qf{background:transparent;border:1px solid var(--line);color:var(--ink-faint);
  font-size:9.5px;letter-spacing:.06em;padding:2px 6px;font-family:var(--mono)}
.qf:hover{border-color:var(--line-hi);color:var(--ink-dim)}
.qf[aria-pressed="true"]{background:var(--amber-dim);color:#f6e6c8;border-color:var(--amber)}
.qf b{font-weight:700;margin-left:3px}
.qf.zero{opacity:.35}
.jobs{display:flex;flex-direction:column;gap:1px;padding:1px 0}
.job{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--line-hi);
  background:var(--panel-2);padding:8px 11px;position:relative;font-family:var(--mono)}
.job:hover{background:var(--panel-3)}
.job[aria-selected="true"]{background:#241f16;box-shadow:inset 0 0 0 1px var(--amber-dim)}
.job.k-rx{border-left-color:var(--k-rx)} .job.k-con{border-left-color:var(--k-con)}
.job.k-edu{border-left-color:var(--k-edu)} .job.k-emt{border-left-color:var(--k-emt)}
.job.k-ass{border-left-color:var(--k-ass)} .job.k-cbr{border-left-color:var(--k-cbr)}
.job.k-help{border-left-color:var(--k-help)} .job.k-emt2{border-left-color:var(--k-emt)}
.job.k-logi{border-left-color:var(--k-logi)} .job.k-lang{border-left-color:var(--k-lang)}
.job.k-crowd{border-left-color:var(--k-crowd)}
.job.k-idn{border-left-color:var(--k-idn)}
.kind.idn{color:var(--k-idn);border-color:var(--k-idn)}
.kind.crowd{color:var(--k-crowd);border-color:var(--k-crowd)}
.kind.logi{color:var(--k-logi);border-color:var(--k-logi)}
.kind.lang{color:var(--k-lang);border-color:var(--k-lang)}
.job.done{opacity:.5}
.j-h{display:flex;justify-content:space-between;gap:8px;font-size:9.5px;color:var(--ink-faint);letter-spacing:.08em}
.j-h b{font-weight:500;color:var(--ink-dim)}
.j-t{display:block;font-family:var(--sans);font-size:13px;margin:3px 0 1px;line-height:1.35}
.j-s{display:block;font-size:10.5px;color:var(--ink-dim);line-height:1.45}
.j-p{display:block;font-family:var(--sans);font-size:10.5px;color:var(--ink-faint);
  margin-top:2px;padding-right:64px;line-height:1.45;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chip{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:0 5px;border:1px solid;margin-left:5px;vertical-align:1px}
.chip.c{color:var(--ctrl);border-color:var(--ctrl)}
.chip.cold{color:var(--cold);border-color:var(--cold)}
.chip.stat{color:var(--t1);border-color:var(--t1)}
.chip.done{color:var(--ok);border-color:var(--ok)}
.chip.ret{color:var(--warn);border-color:var(--warn)}
.chip.err{color:var(--bad);border-color:var(--bad);background:#2a1413}
.age{position:absolute;right:11px;bottom:7px;font-size:9.5px;color:var(--ink-faint)}
.age.late{color:var(--warn)}
.kind{font-family:var(--mono);font-size:9px;letter-spacing:.14em;padding:0 5px;border:1px solid;margin-right:6px}
.kind.rx{color:var(--k-rx);border-color:var(--k-rx)} .kind.con{color:var(--k-con);border-color:var(--k-con)}
.kind.edu{color:var(--k-edu);border-color:var(--k-edu)} .kind.emt{color:var(--k-emt);border-color:var(--k-emt);background:#2a1211}
.kind.ass{color:var(--k-ass);border-color:var(--k-ass)}
.kind.cbr{color:var(--k-cbr);border-color:var(--k-cbr);background:#1f1526}
.kind.help{color:var(--k-help);border-color:var(--k-help)}
/* 幫手 */
.hrow{display:grid;grid-template-columns:22px minmax(0,1.35fr) minmax(0,1fr);gap:9px;align-items:start;
  padding:8px 11px;background:var(--panel-2);border-bottom:1px solid #151a1c;font-size:11.5px;
  width:100%;text-align:left;border-top:0;border-left:0;border-right:0}
.hrow .hn{min-width:0} .hrow .hs{min-width:0;line-height:1.55}
.hrow:hover{background:var(--panel-3)}
.hrow.gone{opacity:.5}
.hrow.gone .hn b, .hrow.gone small{text-decoration:none}
.lgt{display:inline-block;margin-left:5px;padding:1px 5px;font-style:normal;font-size:9px;
  letter-spacing:.06em;color:var(--cold);border:1px solid rgba(122,190,205,.4);vertical-align:1px}
.hrow .hd{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#0b0f11}
.hrow .hn small{display:block;color:var(--ink-faint);font-size:9.5px;font-family:var(--mono)}
.hrow .hs{font-family:var(--mono);font-size:9.5px;text-align:right;color:var(--ink-faint)}
.hrow .hs b{display:block;color:var(--ok);font-weight:400}
.hrow .hs b.idle{color:var(--ink-faint)} .hrow .hs b.no{color:var(--warn)}
.askg{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--amber);
  margin:11px 0 5px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.chk.dim{opacity:.42}
.scopegrid{display:grid;gap:3px;margin-bottom:11px}
.scopeitem{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;background:var(--panel-2);
  border:1px solid var(--line);cursor:pointer;font-size:11.5px}
.scopeitem input{margin:3px 0 0;accent-color:var(--amber);flex:none}
.scopeitem.on{border-color:var(--amber-dim);background:#241f16}
.scopeitem.risky.on{border-color:var(--bad);background:#231416}
.scopeitem small{display:block;color:var(--ink-faint);font-size:10px;margin-top:1px}

/* 藥品架：畫面最右側，可收合 */
#stock{width:254px;border-left:1px solid var(--line);position:relative;overflow:hidden;
  transition:width .16s ease;flex-direction:row}
#stock.closed{width:32px}
#stock-rail{width:32px;flex:none;background:var(--panel-2);border:0;border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:11px 0;color:var(--ink-faint)}
#stock-rail:hover{color:var(--amber-hi);background:var(--panel-3)}
/* 直排標籤：讓中文一字一行，比 writing-mode 穩 */
#stock-rail .rl{order:2;flex:none;width:11px;font-size:10.5px;line-height:1.35;
  word-break:break-all;text-align:center;color:inherit}
#stock-rail .rn{order:1;flex:none;font-family:var(--mono);font-size:8.5px;color:var(--ink-faint);
  border:1px solid var(--line-hi);padding:2px 2px;width:15px;line-height:1.25;
  word-break:break-all;text-align:center}
#stock-rail .rn.hot{color:var(--warn);border-color:var(--warn)}
#stock-rail .rn.hot{color:var(--warn);border-color:var(--warn)}
.stockbody{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#stock.closed .stockbody{display:none}
.stockhead{padding:8px 10px;background:var(--panel-2);border-bottom:1px solid var(--line);flex:none}
.sh1{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:6px}
.sh1 b{font-size:10px;letter-spacing:.18em;color:var(--ink-faint);font-weight:700}
.sh1 em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--ink-dim)}
.sh1 em.hot{color:var(--warn)}
#stock-find{font-size:11px;padding:4px 7px}
.shrow{display:flex;align-items:center;gap:6px;margin-top:6px}
.sbtn{background:transparent;border:1px solid var(--line);color:var(--ink-faint);font-size:9.5px;padding:2px 6px}
.sbtn:hover{border-color:var(--amber);color:var(--amber-hi)}
.sbtn.hb{border-color:var(--k-help);color:var(--k-help)}
.slow{display:flex;align-items:center;gap:4px;font-size:9.5px;color:var(--ink-faint);cursor:pointer;margin-left:auto}
.slow input{accent-color:var(--amber);margin:0}
.dgrp{width:100%;text-align:left;background:var(--panel-3);border:0;border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:4px 1fr auto auto;gap:7px;align-items:center;padding:5px 8px 5px 0;
  position:sticky;top:0;z-index:1}
.dgrp i{display:block;height:16px}
.dgrp .gn{font-size:10.5px;letter-spacing:.06em}
.dgrp .gc{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.dgrp .gc b{color:var(--warn);font-weight:400}
.dgrp .gx{font-family:var(--mono);font-size:9px;color:var(--ink-faint);width:10px;text-align:center}
.drow{display:grid;grid-template-columns:3px 1fr 52px;gap:6px;align-items:center;
  padding:3px 8px 3px 0;background:var(--panel-2);border-bottom:1px solid #151a1c}
.drow i{display:block;height:100%;min-height:17px}
.drow .dn{font-family:var(--mono);font-size:9.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .dn small{display:block;font-family:var(--sans);font-size:8.5px;color:var(--ink-faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .dq{text-align:right;font-family:var(--mono);font-size:9.5px;font-variant-numeric:tabular-nums;color:var(--ink-faint)}
.drow .dq b{color:var(--ink);font-weight:700;font-size:10.5px}
.drow.low .dq b{color:var(--warn)} .drow.out .dq b{color:var(--bad)}
.drow.out .dn{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:#4a3230}
.drow.hi{background:#2a2317;box-shadow:inset 2px 0 0 var(--amber)}
.dempty{padding:12px 10px;color:var(--ink-faint);font-size:10.5px}

/* 右欄 */
.pane{padding:13px 14px}
.pane h2{margin:0 0 3px;font-size:15px;font-weight:700}
.pane .sub{color:var(--ink-faint);font-size:10.5px;font-family:var(--mono);margin-bottom:11px}
.paper{background:#1d211d;border:1px solid #2f3830;padding:11px 12px;margin-bottom:11px;
  font-family:var(--mono);font-size:11.5px;position:relative;
  background-image:repeating-linear-gradient(180deg,transparent 0 21px,rgba(255,255,255,.022) 21px 22px)}
.paper::before{content:attr(data-t);position:absolute;top:-1px;right:-1px;background:#2f3830;
  color:var(--ink-dim);font-size:9px;letter-spacing:.18em;padding:1px 7px;font-family:var(--sans)}
.prow{display:grid;grid-template-columns:58px 1fr;gap:8px;padding:1.5px 0}
.prow span{color:var(--ink-faint);font-family:var(--sans);font-size:10px;letter-spacing:.1em}
.prow b{font-weight:500;color:var(--ink);word-break:break-word}
.prow b.big{font-size:13.5px;color:var(--amber-hi)}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:11px}
.five div{background:var(--panel-2);padding:6px 4px;text-align:center}
.five span{display:block;font-size:9px;letter-spacing:.08em;color:var(--ink-faint)}
.five b{font-family:var(--mono);font-size:11px;display:block;margin-top:2px;color:var(--amber-hi)}
.note{border-left:2px solid var(--line-hi);padding:8px 10px;background:#161b1d;font-size:11.5px;color:var(--ink-dim);margin-bottom:11px}
.note.warn{border-left-color:var(--warn);background:#1d1811}

.note.ctrl{border-left-color:var(--ctrl);background:#1d1417}

.note.ok{border-left-color:var(--ok);background:#121915}
.note b{color:var(--ink)}
.acts{display:grid;gap:4px}

.act:disabled{opacity:.38;cursor:not-allowed}

.act .ac{font-family:var(--mono);font-size:10px;color:var(--amber);letter-spacing:.06em}
.act.warnb{border-color:#4a3a20} .act.warnb .ac{color:var(--warn)}
.field{margin:11px 0}
.field label{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--ink-faint);margin-bottom:4px}
select,textarea,input[type=text]{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  font-family:var(--sans);font-size:12px;padding:7px 9px;width:100%}
textarea{resize:vertical;min-height:52px;font-family:var(--mono);font-size:11.5px}

  border:1px solid var(--line);margin-bottom:3px;cursor:pointer;font-size:11.5px}
.chk input{margin:3px 0 0;accent-color:var(--amber);flex:none}
.chk.on{border-color:var(--amber-dim);background:#241f16}
.chk small{display:block;color:var(--ink-faint);font-size:10px;margin-top:1px}
.opt{display:block;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);padding:10px 12px;margin-bottom:5px;font-size:12px}
.opt:hover{border-color:var(--amber);background:#241f16}
.opt b{display:block;font-size:12.5px;margin-bottom:2px;font-weight:500}
.opt span{font-size:10.5px;color:var(--ink-faint)}
.opt.good{border-color:var(--ok)} .opt.bad{border-color:var(--bad)} .opt.mid{border-color:var(--warn)}
/* 數藥台 */
.counttop{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:11px}
.counttop>div{background:var(--panel-2);padding:7px 8px;text-align:center}

.counttop>div{padding:6px 8px} .counttop b{font-size:16px}
.cntrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cl{font-size:10.5px;color:var(--ink-faint);flex:none}
.cu{font-size:10.5px;color:var(--ink-faint)}

/* ---- 窄螢幕版面 ----
   斷點刻意不用 @media：有些宿主（App 內的檢視器、被縮放的 iframe）給的版面視窗寬度
   跟實際螢幕差很多，media query 整個不成立，桌機的四欄版面就被塞進手機螢幕裡。
   改成由 JS 量實際寬度後掛上 html.narrow，量到什麼就是什麼。 */
html.narrow,html.narrow body{height:100%;overflow-x:hidden;overflow-y:auto;-webkit-text-size-adjust:100%}
/* 手機：3D 固定在上方，下面是你正在用的那一塊。內容放不進去時整頁可以捲，
   不再賭視窗高度剛好等於螢幕高度——賭錯就會有按鈕在畫面外按不到。 */
/* 高度給定，版面才會剛好等於一個螢幕（列高不會被內容撐開）；
   min-height 是保險：宿主給的高度太矮時整頁可以捲，不會有按鈕留在畫面外。 */
html.narrow #app{height:100%;min-height:430px;width:100%;
  grid-template-rows:auto auto minmax(0,1fr) auto auto}
html.narrow #topbar{gap:6px;padding:6px 8px;flex-wrap:nowrap;overflow:hidden;
  position:sticky;top:0;z-index:30}
html.narrow .brand{flex:none;min-width:0}

html.narrow .brand b{font-size:13px;white-space:nowrap;letter-spacing:.02em}
html.narrow .clock{font-size:16px;flex:none} html.narrow .clock small{display:none}
html.narrow .spd{flex:none} html.narrow .spd button{padding:5px 7px}
html.narrow #topbar .gauge{font-size:10px;flex:none}

/* 曝光與待處理改由分頁徽章呈現；發電機油移到 3D 的冷藏庫面板上 */
html.narrow #topbar .gauge:nth-of-type(2),html.narrow #topbar .gauge:nth-of-type(3),
html.narrow #topbar .gauge:nth-of-type(4){display:none}
html.narrow #sp2,html.narrow #sp8{display:none}
html.narrow .topspacer{flex:1;min-width:0}
html.narrow .only-m{display:inline-block;flex:none;padding:6px 11px;font-size:14px;line-height:1}
html.narrow #btn-bench{flex:none;font-size:0;padding:6px 10px}
html.narrow #btn-bench::after{content:"檯";font-size:12px}
html.narrow #moreset{display:none;position:fixed;top:46px;right:8px;z-index:70;
  background:var(--panel-2);border:1px solid var(--line-hi);padding:7px;
  flex-direction:column;gap:5px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
html.narrow body.more #moreset{display:flex}
html.narrow body.more #moreset .tbtn{width:100%;text-align:left}

html.narrow #tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel-2);
  border-bottom:1px solid var(--line);position:sticky;top:41px;z-index:29}
html.narrow #tabs button{background:transparent;border:0;border-bottom:2px solid transparent;
  padding:10px 4px;color:var(--ink-faint);font-size:12px;letter-spacing:.08em;position:relative}
html.narrow #tabs button[aria-pressed="true"]{color:var(--amber-hi);
  border-bottom-color:var(--amber);background:#1d1a13}
html.narrow #tabs button b{font-family:var(--mono);font-size:10px;margin-left:4px;

  -webkit-overflow-scrolling:touch}

html.narrow #bgbar:not(.run):not(.held) .bgt{display:none}
html.narrow .bgt{font-size:10.5px;flex:1 1 auto;min-width:0;

/* 手機上簡報／文件／結束白班都很長：把最後那排按鈕釘在底部，
   不用滑到最下面才找得到「開始白班」。 */
html.narrow .sheet>.btnrow{position:sticky;bottom:-20px;margin:16px -17px -20px;

html.narrow.land #main,html.narrow.land body[data-tab="log"] #main{
  grid-template-rows:clamp(120px,44vh,300px) minmax(0,1fr)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- 0a. 可重現的亂數 ----------
   訓練工具需要「整班跑同一場」的能力：種子寫在網址 #seed=xxxx，
   同一個種子會生出完全相同的幫手、事件與時序，可橫向比較。 */
const SEED = (()=>{
  const m = /seed=([A-Za-z0-9_-]{1,16})/.exec(location.hash||'');
  if (m) return m[1];
  const s = Math.random().toString(36).slice(2,8).toUpperCase();
  try { history.replaceState(null,'','#seed='+s); } catch(e){ /* 無法改寫網址時略過；本場種子仍然有效，只是不能分享連結 */ }
  return s;
})();
// 改了網址上的種子就重開一場
addEventListener('hashchange',()=>{ if (!/seed=/.test(location.hash) || !location.hash.includes(SEED)) location.reload(); });
const rng = (()=>{                       // mulberry32
  let h=1779033703^SEED.length;
  for (let i=0;i<SEED.length;i++){ h=Math.imul(h^SEED.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  let a=(h^h>>>16)>>>0;
  return ()=>{ a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296; };
})();

/** 把一組事件平均鋪在 [from,to] 之間，加上抖動，回傳排序後的時間 */
function spread(n, from, to, jitter){
  const step=(to-from)/n, out=[];
  for (let i=0;i<n;i++){ const v=from+step*i+rnd(-(jitter||step*0.3),(jitter||step*0.3));
    out.push(Math.round(Math.max(from,Math.min(to,v)))); }
  return out.sort((a,b)=>a-b);
}

   七日儲備量是「開站時」的數字。現在是第四天，東西用掉了，而且帳面不一定準——

  const used = chance(.18) ? rnd(.82,.96) : rnd(.35,.75);
  d.have = Math.max(0, Math.round(d.q*(1-used)));

  if (d.st==='ctrl' || d.have===0) d.book = d.have;
  else {
    const drift = Math.max(1, Math.round(d.have*rnd(.06,.22)));
    d.book = Math.max(0, d.have + (chance(.55)? drift : -drift));

/* 盤點會把帳面校正回實際，並告訴你差了多少 */
function doStocktake(byWho){
  let off=0, worst=null;
  DRUGS.forEach(d=>{
    const diff=d.book-d.have;
    if (diff!==0){ off++; if(!worst||Math.abs(diff)>Math.abs(worst.diff)) worst={d,diff}; }
    d.book=d.have; d.counted=true;
  });
  S.counted=true; S.stockOff=off;
  const low=DRUGS.filter(d=>d.have>0 && d.have/d.q<.25).map(d=>d.n.split(' ')[0]);
  const out=DRUGS.filter(d=>d.have<=0).map(d=>d.n.split(' ')[0]);
  log(`盤點完成${byWho?`（${byWho}）`:''}：${off} 項帳面與實際不符。`, off?'l-warn':'l-ok');
  if (worst) log(`落差最大的是 ${worst.d.n.split(' ')[0]}：帳面比實際${worst.diff>0?'多':'少'} ${Math.abs(worst.diff)} ${worst.d.u}。`,'l-warn');
  if (out.length) log(`已經歸零的品項：${out.join('、')}。`,'l-bad');
  if (low.length) log(`低於兩成五：${low.join('、')}。`,'l-warn');
  narrate('你把數字抄進物資管理紀錄表。第四天了，這是第一份可以拿去報的清單。');
  mark('P4', true, `完成盤點，校正 ${off} 項帳面落差`);
  if (off>6) mark('P3', false, `盤點前有 ${off} 項帳面與實際不符，代表前幾日的出入庫登記不完整`);
  dirty.stock=true;
}

const FREQ = {qd:1,hs:1,bid:2,tid:3,qid:4,q4h:6,q6h:4,q8h:3,q12h:2,q24h:1,stat:1,prn:0};
function sigOf(j){
  const dose=j.dose||'';
  const fk=(dose.toLowerCase().match(/\b(q\d+h|qd|bid|tid|qid|hs|stat|prn)\b/)||[])[1];
  const perDay=FREQ[fk]!=null?FREQ[fk]:1;
  const strength=parseFloat((j.drug.n.match(/([\d.]+)\s*(mg|µg|g)/)||[])[1]);
  const amt=parseFloat((dose.match(/([\d.]+)\s*(mg|µg|g)/)||[])[1]);
  let per=1;
  if (strength&&amt){ const r=amt/strength; if (r>=1&&Math.abs(r-Math.round(r))<0.01) per=Math.round(r); }
  const days = fk==='stat' ? 0 : (j.days||3);
  const total = fk==='stat' ? per : (fk==='prn' ? per*3 : per*perDay*days);
  return {fk:fk||'qd', perDay, per, days, total, stat:fk==='stat'};
}

  const fk=(dose.toLowerCase().match(/\b(q\d+h|qd|bid|tid|qid|hs|stat|prn)\b/)||[])[1]||'stat';
  const perDay=FREQ[fk]!=null?FREQ[fk]:1;
  const dm=dose.match(/[×x]\s*(\d+)\s*天/);
  const xm=dose.match(/[×x]\s*(\d+)\s*(?!天)/);
  // 針劑一次配一次的量，除非處方寫明天數或「×N」
  const days = dm ? parseInt(dm[1],10) : (fk==='prn' ? 1 : 0);
  const perDose = Math.ceil((amt/d.vial.a) * 1000)/1000;
  const doses = days>0 ? perDay*days : (xm ? parseInt(xm[1],10) : 1);
  const need = Math.ceil(perDose*doses - 1e-9);
  return {amt, u, per:d.vial.a, perDose, perDay, days, doses, need,
    unit: UNIT_NAME[d.f]||'支'};
}

function genHelper(i){
  const pool=[]; ARCHETYPES.forEach(a=>{ for(let k=0;k<a.w;k++) pool.push(a); });
  const A=pick(pool);
  const sex = A.sex || (chance(.5)?'f':'m');
  const age = rint(A.age[0],A.age[1]);
  const d = {yrs: Math.max(3, Math.min(age-24, rint(4,26))), place: pick(PLACES),
             grade: pick(['三','四']), retire: rint(2012,2021), job: pick(JOBS_CIVIL)};
  const THIEF_TELLS=['他問了兩次管制藥品櫃的鑰匙放在哪。','他的袖口鼓鼓的，你沒看清楚是什麼。',
    '他說話時一直站在你和層架之間。','他對品項的說法很熟，但對流程一問三不知。'];
  const name = pick(SURNAMES) + (sex==='f' ? pick(GIVEN_F) : pick(GIVEN_M));
  const honor = /rph/.test(A.k) ? '藥師' : A.k==='nurse' ? '護理師'
    : A.k==='dentist' ? '醫師' : A.k==='vet' ? '獸醫師'
    : (sex==='f'?'小姐':'先生');
  const display = name.slice(0,1) + honor;
  /* 語言：這一區住的人本來就不只講一種話。會講第二種語言的人，
     在有語言障礙的傷患面前，比你多的是耳朵而不是資格。 */
  const lang = chance(.5) ? pick(['台語','台語','客語','日語','日語','英語','英語','越南語','印尼語','粵語']) : null;
  const ok = A.ok.slice(), risky = A.risky.slice();
  if (lang) ok.push('translate'); else risky.push('translate');
  /* 每個人待多久、為什麼走。有些人待到你下班，有些人只是路過幫一手。 */
  const STAY = [
    {w:26, mins:[999,999], why:null},
    {w:16, mins:[150,260], why:'上面的收容所排了輪班，我得回去。'},
    {w:14, mins:[110,200], why:'我女兒在留觀區，我去看她一下就回來——如果回得來。'},
    {w:12, mins:[90,170],  why:'站長把我調去檢傷那邊，那裡現在更亂。'},
    {w:12, mins:[80,150],  why:'我不行了，我從昨天到現在沒睡。'},
    {w:10, mins:[60,120],  why:'我先生在外面等我，我真的得走了。'},
    {w:10, mins:[70,140],  why:'我只是路過看你忙不過來。我該回去顧我自己的人了。'},
  ];
  const spool=[]; STAY.forEach(x=>{ for(let k=0;k<x.w;k++) spool.push(x); });
  const st = pick(spool);
  return {id:'h'+i, arch:A.k, name:display, full:name, age, sex, lang,
    tag:A.tag(d), say:A.say(d)+'　'+pick(WHYHERE), quirk:A.k==='thief'?pick(THIEF_TELLS):pick(QUIRKS), thief:!!A.thief,
    verify:A.verify, verifyTxt:A.vtxt(d), ok, risky,
    stayMin: st.why ? rint(st.mins[0],st.mins[1]) : 999, leaveWhy: st.why,
    needBrief:A.needBrief, col:A.col, skill:A.skill};
}
const HELPERS = (()=>{
  const n = rint(3,5), used=new Set(), out=[];
  const times = spread(n, 30, 620, 45);
  for (let i=0;i<n;i++){
    let h, guard=0;
    do { h=genHelper(i+1); guard++; } while (used.has(h.arch) && guard<24);
    used.add(h.arch); h.t=times[i]; out.push(h);
  }
  return out;
})();

/* ---------- 4c. 隨機編排這一場 ----------
   處方維持敘事順序（後面的處方會參照前面的事），但每次的「間隔」不同；
   諮詢、衛教、支援作業從題庫抽樣；幫手、CBRNE、大量傷患的時間點都會移動。 */
/* 突發事件池：每一場抽 3–5 個，時間與順序都不一樣。
   每一個都要你在幾秒內決定一件事，而且每一個都會在某個地方回來找你。 */
const EVT_POOL = [
 {id:'raid',   w:14, t:[40,660]}, {id:'comms',  w:12, t:[60,620]},
 {id:'fridged',w:11, t:[70,600]}, {id:'lasa',   w:12, t:[60,640]},
 {id:'water',  w:9,  t:[90,600]}, {id:'ownmeds',w:12, t:[50,640]},

];
const S_MCI={t:340};
const RX_STAT={total:0,bad:0,by:{}};   // 今天總共幾張處方、其中幾張有問題
/* 藥袋：一位病人的幾張處方一起到。慢性病斷藥的人，平常拿的不只一種病的藥；
   每一張仍要各自核對，但也要看同一袋裡的其他品項有沒有互相打架。
   每場抽 1–2 袋；同一袋由同一位醫師開、相隔一兩分鐘送到。 */
const RX_BAGS = [
 {pid:14, preferBy:'何醫師', items:[

  {d:'asa',  dose:'100 mg PO qd ×3 天份', why:'長期服用的低劑量 Aspirin，維持原劑量。'},
  {d:'metf', dose:'500 mg PO bid ×3 天份', flag:'renal',
   why:'傷患11 是 82 歲、44 kg 的長者，正在脫水。脫水時 Metformin 有乳酸中毒的風險，這種時候要先暫停。',
   alt:'暫停 Metformin，先補水並評估腎功能，恢復進食後再請醫師決定。'}]},
 {pid:5, preferBy:'林醫師', items:[
  {d:'amlo', dose:'5 mg PO qd ×3 天份', why:'透析病人的降血壓藥，維持原劑量。'},
  {d:'asa',  dose:'100 mg PO qd ×3 天份', why:'維持原本的低劑量 Aspirin。'},
  {d:'glim', dose:'5 mg PO qd ×3 天份', flag:'renal',
   why:'傷患05 在透析、已中斷。腎功能這麼差，Glimepiride 的作用會拉長，低血糖風險高。',
   alt:'先不要配。請醫師重新評估降血糖用藥，並以血糖監測為主。'}]},
];
const SCENARIO = (()=>{
  const raw = JOBS.splice(0, JOBS.length);
  /* 處方池 ＝ 原本的敘事處方 ＋ 補充題庫。
     今天不是每兩張就有一張錯。是二十幾張裡有四、五張，而且幾乎都落在
     被調來代打的那幾個人身上——這才是你在第四天真正會看到的分布。 */
  const rxRaw   = raw.filter(j=>j.kind==='rx').concat(RX_CLEAN, RX_FLAGGED);
  const rxStat  = rxRaw.filter(j=>j.stat);
  // 乾淨的處方題庫比一場用得到的多，所以每場抽一部分——兩場之間不會長一樣
  const rxClean = sample(rxRaw.filter(j=>!j.stat && !j.flag), rint(18,21));
  const rxBad   = shuffle(rxRaw.filter(j=>!j.stat && j.flag)).slice(0, rint(3,4));
  const bagJobs = sample(RX_BAGS, rint(1,2)).flatMap((b,bi)=>b.items.map((it,k)=>
    ({kind:'rx', pid:b.pid, preferBy:b.preferBy, ...it, bag:'B'+(bi+1), bagK:k+1, bagN:b.items.length})));
  const rxAll   = rxStat.concat(rxClean, rxBad, bagJobs);

  /* 誰開的。先把有問題的處方分給「會犯這一種錯的人」，
     再依各人應有的錯誤率補上乾淨的處方——這樣每個人在這一場的個人錯誤率
     才會落在他該有的水準（急診與家醫幾個百分點；代打的兩三成），
     而不是「凡是錯的都是他開的」。剩下的處方依開方量分給大家。 */
  const pick=(cand,wts)=>{ let r=rnd(0,wts.reduce((a,b)=>a+b,0));
    for (let i=0;i<cand.length;i++){ r-=wts[i]; if (r<=0) return cand[i]; }
    return cand[cand.length-1]; };
  const tally={}; PRESCRIBERS.forEach(d=>tally[d.n]={bad:0,ok:0});
  rxStat.concat(rxBad, bagJobs).filter(j=>j.flag).forEach(j=>{
    let n;
    if (j.preferBy && DOC[j.preferBy] && chance(.8)) n=j.preferBy;
    else { const fit=PRESCRIBERS.filter(d=>d.kinds.includes(j.flag));
      const cand=fit.length?fit:PRESCRIBERS;
      n=pick(cand, cand.map(d=>d.err*100)).n; }
    j.by=n; tally[n].bad++;
  });
  const cleanQ = shuffle(rxStat.filter(j=>!j.flag).concat(rxClean, bagJobs.filter(j=>!j.flag)));
  let ci=0, budget=Math.floor(cleanQ.length*.45);   // 代打的人最多拿走四成五，其餘仍是主力在開
  PRESCRIBERS.forEach(d=>{                       // 先補足各人「該有的乾淨處方張數」
    if (!tally[d.n].bad) return;
    const want = Math.min(6, budget, Math.ceil(tally[d.n].bad/d.err)) - tally[d.n].bad;
    for (let k=0;k<want && ci<cleanQ.length;k++,ci++){
      cleanQ[ci].by=d.n; tally[d.n].ok++; budget--; }
  });
  for (; ci<cleanQ.length; ci++){                // 其餘依開方量分
    const d=pick(PRESCRIBERS, PRESCRIBERS.map(x=>x.w*(1-x.err)));
    cleanQ[ci].by=d.n; tally[d.n].ok++;
  }
  // 同一個藥袋＝同一位醫師開的：以有問題的那一張的開立者為準
  const bagBy={};
  bagJobs.forEach(j=>{ const bad=bagJobs.find(x=>x.bag===j.bag&&x.flag); bagBy[j.bag]=(bad||j).by; });
  bagJobs.forEach(j=>{ const to=bagBy[j.bag];
    if (j.by!==to){ const k=j.flag?'bad':'ok'; tally[j.by][k]--; tally[to][k]++; j.by=to; } });
  RX_STAT.total = rxAll.length;
  RX_STAT.bad   = rxAll.filter(j=>j.flag).length;
  RX_STAT.by    = tally;
  const conPool = raw.filter(j=>j.kind==='con').concat(EXTRA_CONSULTS);
  const eduPool = raw.filter(j=>j.kind==='edu').concat(EXTRA_EDU);
  const assPool = ASSISTS.concat(EXTRA_ASSISTS);
  const emtAll = raw.filter(j=>j.kind==='emt');
  const out = [];

  // 大量傷患錨點：STAT 群集跟著它走
  const mciT = rint(290,395); S_MCI.t = mciT;
  out.push({t:mciT, kind:'evt', id:'mci', title:'街口爆炸，大量傷患'});
  const stat = rxAll.filter(j=>j.stat);
  stat.forEach((j,i)=>out.push({...j, t:mciT+2+i*rint(3,6)}));

  // 其餘處方：順序完全打散。有前後關係的那幾張改成「條件成立才會出現」，
  // 所以打散不會讓劇情說不通。
  const DEP = {
    dup:   {pid:1, given:'acet'},          // 重複用藥：要先真的給過一次
    dose:  {pid:12, given:'mor'},          // 劑量翻倍：要先給過原劑量
  };
  const rest = shuffle(rxAll.filter(j=>!j.stat && !j.bag));
  let t = rint(3,9);
  rest.forEach(j=>{
    if (t>mciT-14 && t<mciT+26) t = mciT+28;      // 避開大量傷患那一段
    const dep = j.flag && DEP[j.flag] && DEP[j.flag].pid===j.pid ? DEP[j.flag] : null;
    out.push({...j, t:Math.round(t), dep});
    t += rint(15,31);
  });
  const endT = Math.min(700, t);
  // 藥袋：同一位病人的處方一起到（相隔一兩分鐘）
  [...new Set(bagJobs.map(j=>j.bag))].forEach((id,i)=>{
    let tb = rint(70+i*170, 190+i*170);
    if (tb>mciT-14 && tb<mciT+26) tb = mciT+30;
    bagJobs.filter(j=>j.bag===id).forEach((j,k)=>out.push({...j, t:tb+k}));
  });

  // 抽樣：諮詢 5–6、衛教 3–4、支援作業 3
  function place(list, from, to, jit, extra){
    const ts=spread(list.length, from, to, jit);
    list.forEach((j,i)=>out.push({...j, ...(extra||{}), t:ts[i]}));
  }
  place(sample(conPool, rint(4,6)), 55, endT-30, 40);
  place(sample(eduPool, rint(2,4)), 40, endT-40, 45);
  place(sample(assPool, rint(2,3)), 80, endT-60, 50, {kind:'ass'});

  // EMT-2：大場景這一場只會遇到一個，其餘是護理師隨口的求援
  const big = sample(emtAll, chance(.75)?1:0);   // 大場景不是每一場都有
  place(big, 200, endT-120, 70);
  place(sample(EMT_ASSIST, rint(2,4)), 70, endT-40, 55);

  // CBRNE 不是每一場都有；管制藥品短少七成的場次會發生
  if (chance(.6)) out.push({...CBRNE, kind:'cbr', t:rint(470, Math.max(500,endT-60))});
  if (chance(.7)) out.push({t:rint(430,560), kind:'evt', id:'shortage', title:'管制藥品盤點短少'});
  /* 突發事件：每場抽 3–5 個，不重複，時間各自隨機。 */
  {
    const pool=EVT_POOL.slice(), take=Math.min(pool.length, rint(3,5)), chosen=[];
    for (let k=0;k<take && pool.length;k++){
      const tot=pool.reduce((a,x)=>a+x.w,0); let r=rnd(0,tot), idx=0;
      for (let i=0;i<pool.length;i++){ r-=pool[i].w; if (r<=0){ idx=i; break; } }
      chosen.push(pool.splice(idx,1)[0]);
    }
    const slots=spread(chosen.length, 60, Math.max(120,endT-40), 55);
    chosen.forEach((e,i)=>{
      let t=slots[i];
      t=Math.max(e.t[0], Math.min(e.t[1], t));
      if (t>mciT-10 && t<mciT+30) t=mciT+32;      // 不要跟大量傷患重疊
      out.push({t:Math.round(t), kind:'evt', id:e.id});
    });
  }

  // 物流到訪：2–3 次，來給或來要
  const convoys = sample(CONVOYS, rint(1,3)).map(c=>({kind:'logi', c,
    mode: chance(.55)?'give':'take'}));
  place(convoys, 120, endT-50, 60);
  // 語言不通的傷患：1–2 位
  place(sample(LANG_CASES, rint(1,2)), 90, endT-70, 60, {kind:'lang'});
  // 窗口前的人：一場 2–4 件
  place(sample(CROWD_CASES, rint(2,4)), 70, endT-40, 55, {kind:'crowd'});
  // 幫手
  HELPERS.forEach(h=>out.push({t:h.t, kind:'help', h}));

  out.sort((a,b)=>a.t-b.t);
  out.forEach(j=>JOBS.push(j));
  return {mciT, endT, n:out.length};
})();

  P10:['幫手的查核、授權與督導','資格查核、授權範圍、作業簡介與督導'],

for (const k in COMP) S.comp[k] = {good:0,bad:0,ev:[]};
const clock = m => String(8+Math.floor(m/60)).padStart(2,'0')+':'+String(Math.floor(m%60)).padStart(2,'0');
function log(m,c){S.log.push({t:clock(S.t),m,c:c||''}); if(S.log.length>300)S.log.shift(); dirty.log=true;}
function mark(k,good,txt){const e=S.comp[k]; if(!e)return; good?e.good++:e.bad++;
  e.ev.push({t:clock(S.t),good,txt}); if(e.ev.length>30)e.ev.shift();}

/* ---------- 6. 工作項目流程 ---------- */
function pending(){ return S.jobs.filter(j=>j.status==='pending'); }
function pushJob(spec){
  const j = {...spec, n:S.nextN++, issued:S.t, status:'pending'};
  if (j.kind==='rx'){
    j.drug = drugById[j.d]; j.pat = patById[j.pid];
    j.ctrl = j.ctrl || j.drug.st==='ctrl'; j.cold = j.drug.st==='cold';
    j.ledger=false; j.dual=false;
    log(`${j.by} 開立處方 #${String(j.n).padStart(2,'0')}　${j.pat.nm}　${j.drug.n}`, j.ctrl?'l-key':(j.stat?'l-warn':''));
  } else if (j.kind==='con'){
    log(`${j.who} 到領藥窗口找你諮詢。`, 'l-con');
  } else if (j.kind==='edu'){
    j.pat = patById[j.pid]; j.picked = [];
    log(`${j.pat.nm} 的用藥諮詢：${j.topic}`, 'l-con');
  } else if (j.kind==='emt'){
    j.step = 0; j.res = [];
    log(`※ ${j.title}　—　醫護都在別處，你是最近的人，而你持有 EMT-2。`, 'l-bad');
  } else if (j.kind==='ass'){
    j.picked = [];
    log(`${j.who} 來請你幫忙：${j.title}`, 'l-con');
  } else if (j.kind==='logi'){
    j.picked=[]; j.why=''; j.rec=false; j.book=false;
    // 來調的人不一定帶了書面需求清單。沒有清單就調出去，帳與責任都會落在你這一端
    if (j.mode==='take'){ j.hasList=chance(.45); j.askedList=false;
      j.listItems=sample(ASK_ITEMS.filter(x=>!x.sup), rint(2,4)).map(x=>x.n); }
    log(`※ 車道口：${j.c.f} 到了。`, 'l-key');
    say(j.c.who, j.mode==='give'? j.c.give : j.c.take, 6800);
  } else if (j.kind==='idn'){
    j.picked=[];
    log(`待辨識區：${j.from} 送來的 ${j.items.length} 項品項需要比對後才能上架。`, 'l-warn');
  } else if (j.kind==='crowd'){
    j.picked=[]; j.pts=j.pts.slice();
    log(`※ 領藥窗口：${j.title}`, 'l-bad');
    say(j.who, j.intro.replace(/<[^>]+>/g,' ').split('。')[0]+'。', 6400);
  } else if (j.kind==='lang'){
    j.picked=[];
    j.pts=j.pts.slice();
    log(`領藥窗口來了一位${j.flagTxt}的病人，溝通有困難。`, 'l-con');
  } else if (j.kind==='emt2'){
    log(`${j.who} 在${zoneById[j.zone].name}叫住你：${j.title}`, 'l-con');
  } else if (j.kind==='cbr'){
    j.step = 0; j.res = [];
    log(`※※ ${j.title}　—　人還在除污區外面。`, 'l-bad');
  } else if (j.kind==='help'){
    j.stage='meet'; j.scope=[]; j.verified=null; j.briefed=false;
    log(`避難民眾 ${j.h.name} 走到領藥窗口：「${j.h.say.slice(0,18)}…」`, 'l-key');
  }
  S.jobs.push(j);
  if (S.sel==null || pending().length===1) S.sel = j.n;
  if (S.autopause && S.running && (j.kind==='emt' || j.kind==='emt2' || j.kind==='cbr' || j.kind==='help' || j.kind==='logi' || j.kind==='lang' || j.stat || j.kind==='con')){
    S.running = false; syncSpeed();
    if (MOBILE()) setTab('act');
  }
  dirty.q = dirty.detail = true;
  return j;
}
/* ---------- 空檔工作 ----------
   盤點、製冰、備藥包不必一口氣做完。你在等人、在等窗口、在等別人回話的時候做，
   一有工作進來就自動停下，之後從斷點繼續。 */
const BGJOBS = {
  count:{n:'藥品盤點與效期查核', min:16, hint:'指引伍、三：由護理人員或藥師（或指定人員）清查一次庫存與效期',
    done:(by)=>doStocktake(by)},
  ice:{n:'預製冰塊與保冷袋', min:10, hint:'在冷鏈出事之前先準備，出事時可立即投入',
    done:(by)=>{ S.iceReady=true;
      log('保冷袋備妥。冷鏈若中斷可立即投入，多撐約 90 分鐘。','l-cold');
      mark('P5',true,'事前預製冰塊與保冷袋'); }},
  pack:{n:'預先分裝夜間備藥包', min:20, hint:'夜班沒有藥師。現在分裝貼標，晚上護理師就不必從瓶子裡數藥',
    done:(by)=>{ S.packReady=true;
      log('留觀十床的夜間備藥包已分裝貼標。','l-ok');
      narrate('十個小袋子按床號排好，每一個上面都寫著藥名、劑量、時間。你不會在場，但這些字會在。');
      mark('P8',true,'提前完成夜間備藥包分裝與貼標'); }},
  tidy:{n:'整理處方籃與紀錄歸檔', min:8, hint:'把已完成的紙本歸位，降低交接時找不到東西的機會',
    done:(by)=>{ S.tidy=true; log('處方籃與紀錄已歸檔。','l-ok');
      mark('P3',true,'紙本處方與紀錄完成歸檔'); }},
};
function startBg(id){
  const b=BGJOBS[id];
  if (S.bg && S.bg.id===id) return;
  let mult=1;
  const h=activeWith(id==='pack'?'pack':'count');
  if (h) mult = h.briefed?0.55:0.75;
  S.bg={id, name:b.n, remain:b.min*mult, total:b.min*mult, helper:h?h.h.name:null};
  log(`開始空檔工作：${b.n}${h?`（${h.h.name}一起）`:''}`);
  if (!S.over && $('modal').hidden && !S.running){ S.running=true; syncSpeed(); }
  dirty.bg=true;
}
function stopBg(){ if(!S.bg) return; log(`暫停空檔工作：${S.bg.name}（已完成 ${Math.round((1-S.bg.remain/S.bg.total)*100)}%）`);
  S.bgPaused=S.bg; S.bg=null; dirty.bg=true; }
function tickBg(dt){
  if (!S.bg) return;
  if (S.task) return;                       // 手上有正事就先放著
  S.bg.remain -= dt;
  if (S.bg.remain<=0){ const b=BGJOBS[S.bg.id]; const hw=S.bg.helper; S.bg=null; S.bgPaused=null; b.done(hw); }
  dirty.bg=true;
}
function renderBg(){
  const el=$('bgbar');
  if (!S.bg){
    const p=S.bgPaused;
    put('bgbar', `<span class="bgl">空檔工作</span>
      <span class="bgt">${p?`${p.name}　已完成 ${Math.round((1-p.remain/p.total)*100)}%，尚未繼續`:'目前沒有。等人、等窗口、等回話的時候可以做這些：'}</span>
      <span class="bgb">${choreHelpers().map(r=>
        `<button class="sbtn hb" data-chore="${r.h.id}" title="把雜事交給 ${r.h.name} 獨立完成">交給 ${r.h.name}</button>`).join('')}
        ${Object.keys(BGJOBS).map(k=>{
        const dn = (k==='count'&&S.counted)||(k==='ice'&&S.iceReady)||(k==='pack'&&S.packReady)||(k==='tidy'&&S.tidy);
        return `<button class="sbtn" data-bg="${k}" ${dn?'disabled style="opacity:.35"':''}
          title="${BGJOBS[k].hint}">${dn?'✓ ':''}${BGJOBS[k].n}</button>`;}).join('')}</span>`);
    el.className=''; return;
  }
  const pct=Math.max(0,Math.min(100,(1-S.bg.remain/S.bg.total)*100));
  put('bgbar', `<span class="bgl">空檔工作</span>
    <span class="bgt">${S.bg.name}${S.bg.helper?`　·　${S.bg.helper} 一起做`:''}
      ${S.task?'<b class="hold">　—　手上有正事，已自動暫停</b>':`　·　剩 ${S.bg.remain.toFixed(0)} 分`}</span>
    <span class="bgp"><i style="width:${pct.toFixed(0)}%"></i></span>
    <span class="bgb"><button class="sbtn" data-bg="stop">放下</button></span>`);
  el.className = S.task?'held':'run';
}

function startWork(name, min, then){
  if (min<=0){ if (then) then(); dirty.detail=true; return; }   // 不佔時間的工作直接完成
  S.task={n:name,remain:min,total:min,then}; dirty.detail=true;
  // 你一旦動手，時間就要走。否則「新事件自動暫停」會讓進度條停在原地不動。
  if (!S.over && $('modal').hidden && !S.running){ S.running=true; syncSpeed(); }
}

function dispTime(j){
  // 數藥與數支本身就是那件工作，數完即交付，不再空轉倒數。
  // 只有「沒有空針要跑到別的區去找」這種實際上真的要走路的事，才留時間。
  if (needsCount(j)) return (j.drug.f==='針劑' && !S.sup.sharp) ? 2 : 0;
  let m = j.drug.f==='藥水'?2.5 : 2;
  if (j.pat.child && j.drug.f!=='藥水') m += 2;
  if (j.ctrl) m += 2;
  if (j.cold) m += 1.5;
  if (S.fatigue>60) m *= 1.25;
  const h = activeWith('dispense') || activeWith('pack');
  if (h) m *= h.briefed?0.62:0.78;   // 有人幫忙就快，但沒做過作業簡介的人幫得比較有限
  return m;
}
/* ---------- 數藥 ----------
   口服固體要真的數。罐裝就是數顆；排裝是「幾排又幾顆」，而每一排有幾顆不一定。 */
function needsCount(j){
  if (j.drug.f==='口服' && j.drug.pk) return true;
  return !!vialOf(j);          // 針劑／霧化／輸液：數支數
}
function submitCount(j, total, strips, loose){
  const sig=sigOf(j), d=j.drug;
  const right = total===sig.total;
  const blister = d.pk.type==='blister';
  const packRight = !blister || (strips*d.pk.per+loose===total && loose<d.pk.per);
  j.counted={total, strips, loose, want:sig.total, right, packRight};
  if (right && packRight){
    mark('P2', true, `#${j.n} ${d.n.split(' ')[0]} 數量正確（${sig.per}顆 × ${sig.perDay}次 × ${sig.days}日 = ${sig.total}）`);
  } else if (!right){
    mark('P2', false, `#${j.n} 數量錯誤：給了 ${total}，應為 ${sig.total}（${sig.per}顆 × ${sig.perDay}次 × ${sig.days}日）`);
    log(`※ #${String(j.n).padStart(2,'0')} ${d.n.split(' ')[0]} 數量錯誤：${total} 顆，應為 ${sig.total} 顆。`,'l-bad');
  } else {
    mark('P2', false, `#${j.n} 排裝換算錯誤：${strips} 排又 ${loose} 顆 ≠ ${total}`);
    log(`※ #${String(j.n).padStart(2,'0')} 排裝換算不符。`,'l-warn');
  }
  doDispense(j, j._annotate, total);
}
/* 針劑的數量核對。這一題的答案常常不是 1。 */
function submitVial(j, got, vl){
  const d=j.drug, right = got===vl.need;
  j.counted={total:got, want:vl.need, right, packRight:true, vial:true, unit:vl.unit};
  const how=`${vl.amt}${vl.u} ÷ 一支 ${vl.per}${vl.u}`
    + (vl.days>0?` × ${vl.perDay}次 × ${vl.days}日`:(vl.doses>1?` × ${vl.doses} 次`:''))
    + ` = ${vl.need} ${vl.unit}`;
  if (right){
    mark('P2', true, `#${j.n} ${d.n.split(' ')[0]} 取量正確（${how}）`);
  } else {
    mark('P2', false, `#${j.n} 取量錯誤：拿了 ${got} ${vl.unit}，應為 ${vl.need} ${vl.unit}（${how}）`);
    if (got<vl.need){
      log(`※ #${String(j.n).padStart(2,'0')} ${d.n.split(' ')[0]} 只拿了 ${got} ${vl.unit}，`
        +`一支只有 ${vl.per}${vl.u}，處方要 ${vl.amt}${vl.u}——劑量不夠。`,'l-bad');
    } else {
      log(`※ #${String(j.n).padStart(2,'0')} ${d.n.split(' ')[0]} 多拿了 ${got-vl.need} ${vl.unit}。`
        +(d.st==='ctrl'?'管制藥品的數量必須與簿冊一致。':''),'l-warn');
      if (d.st==='ctrl') mark('P3', false, `#${j.n} 管制藥品取出量與處方不符（多取 ${got-vl.need} ${vl.unit}）`);
    }
  }
  doDispense(j, j._annotate, got);
}
function doDispense(j, annotate, units){
  if (!inZone(player.pos,'pharm')){ log('調劑必須在藥局的獨立作業空間內完成。','l-warn'); return; }
  // 口服固體要先數藥
  if (needsCount(j) && !j.counted){ j._annotate=annotate; j.counting=true; dirty.detail=true;
    reveal('.counttop'); return; }
  const n = units || 1;
  if (j.drug.have < n){
    // 帳面有、架上沒有——這就是不盤點的代價
    log(`架上找不到那麼多 ${j.drug.n.split(' ')[0]}。帳面是 ${j.drug.book}，實際只有 ${j.drug.have}。`,'l-bad');
    say('你', `${j.drug.n.split(' ')[0]} 不夠。帳面跟實際對不起來。`, 4200);
    j.drug.book = j.drug.have; j.drug.counted = true;
    mark('P4', false, `#${j.n} 調劑時才發現 ${j.drug.n.split(' ')[0]} 帳面與實際不符`);
    j.counting=false; j.counted=null; dirty.stock=dirty.detail=true; return;
  }
  if (j.ctrl && !j.ledger){ S.ctrlSkipped++;
    mark('P3',false,`#${j.n} ${j.drug.n} 未完成逐筆登記即取出`);
    log(`※ 管制藥品 ${j.drug.n} 未登記即取出。`,'l-bad'); }
  startWork(`調劑：${j.drug.n}`, dispTime(j)+(annotate?2:0), ()=>{
    j.drug.have = Math.max(0,j.drug.have-n);
    j.drug.book = Math.max(0,j.drug.book-n);
    j.status='done'; j.doneAt=S.t; j.annotated=!!annotate; S.dispensed++;
    j.pat.given.push({d:j.drug.id,t:S.t});
    if (j.flag && j.insisted && annotate){
      // 你問了、對方堅持、你配了並且寫下來——這是藥師能做到的全部，責任已經移轉
      mark('P1',true,`#${j.n} 已提出疑慮（${REASON_N[j.flag]}），開立者堅持原處方，配發並完整註記`);
      mark('P7',true,`#${j.n} 疑慮、對方回覆與最終決定都留下了紀錄`);
      S.errors++; j.pat.harm++;
      log(`#${String(j.n).padStart(2,'0')} 依 ${j.by} 堅持配發，疑慮已註記。後果不在你這一端。`,'l-warn');
    } else if (j.flag){ S.errors++; j.pat.harm++;
      mark('P1',false,`#${j.n} ${j.pat.nm}：${REASON_N[j.flag]} 未被攔截`
        + (j.insisted?'（你問過了，對方堅持——但你沒有把疑慮寫下來）':''));
      if (['dose','route','ped','sig'].includes(j.flag)) mark('P2',false,`#${j.n} 劑型或劑量問題流出藥局`);
      log(`※ 給藥事件：#${j.n} ${j.pat.nm} ${j.drug.n} — ${REASON_N[j.flag]}`,'l-bad');
    } else {
      mark('P1',true,`#${j.n} ${j.drug.n} 核對後調劑`);
      if (j.pat.child) mark('P2',true,`#${j.n} 兒童劑型處理正確`);
      log(`完成調劑 #${String(j.n).padStart(2,'0')} ${j.pat.nm} ${j.drug.n}`,'l-ok');
    }
    // 沒有辨識就上架的外來品項：含量可能不是你以為的那個
    if (j.drug.unverified>0 && !j.flag && chance(.38)){
      S.errors++; j.pat.harm++;
      mark('P2', false, `#${j.n} 取到未經辨識的外來品項，含量與本站慣用規格不同`);
      mark('P4', false, `未辨識即上架的後果出現在 ${j.pat.nm} 身上`);
      log(`※ #${String(j.n).padStart(2,'0')} 這一支是外援送來的，含量跟我們慣用的不一樣——`
        +`而沒有人比對過。`,'l-bad');
      j.drug.unverified=Math.max(0,j.drug.unverified-1);
    }
    // 耗材的缺口不會讓你配不出藥，但會改變交出去的東西長什麼樣
    if (!S.sup.label && !S.supWarn.label){ S.supWarn.label=1;
      mark('P2',false,'藥袋與標籤紙用盡，標籤改為手寫（品名劑量易誤讀）');
      log('※ 標籤紙用完了。從這一張開始，藥袋上的字是你手寫的。','l-warn'); }
    if (!S.sup.oral && j.pat.child && j.drug.f==='藥水' && !S.supWarn.oral){ S.supWarn.oral=1;
      mark('P2',false,'無口服注射器與量藥杯，兒童藥水無法精確計量');
      log('※ 沒有量藥杯。你只能跟家屬說「大概到這裡」。','l-bad'); }
    startPickup(j);   // 有人會走過來拿
    // 幫手的失誤：未經作業簡介、或被授權超出其範圍的人參與調劑
    const hp = activeWith('dispense');
    if (hp && !j.flag){
      const risky = hp.h.risky.includes('dispense');
      const chance = risky ? 0.45 : (hp.briefed ? 0.03 : 0.18);
      if (rng() < chance){
        hp.err++; S.errors++; j.pat.harm++;
        const what = risky ? '把外觀相近的品項拿錯' : '拿到同名不同劑量的品項';
        log(`※ ${hp.h.name} 在協助調劑時${what}，你在交付前沒有再核對一次。`,'l-bad');
        mark('P10', false, `${hp.h.name} 協助調劑時發生錯誤（${risky?'超出授權範圍':'未完成作業簡介'}）`);
        mark('P1', false, `#${j.n} 經幫手之手的品項未於交付前再核對`);
      }
    }
    if (j.cold && S.fridge>8) mark('P5',false,`#${j.n} 於冷鏈異常期間仍配發冷藏品項`);
    if (j.ctrl && j.ledger){ S.ctrlLedger.push({t:clock(S.t),d:j.drug.n,p:j.pat.nm,dual:j.dual});
      mark('P3',true,`#${j.n} ${j.drug.n} 已逐筆登記${j.dual?'、雙人核對':'（無雙人核對）'}`); }
    dirty.q=dirty.stock=dirty.detail=true;
  });
}
/* 相近的退回理由：切點不同但攔截是對的，不該當成判斷錯誤。 */
const NEAR = {
  dose:['ped','renal'], ped:['dose','old'], renal:['dose','inter'],
  old:['ped','inter','dose'], inter:['old','renal'], sig:['dose'],
  route:['sig'], dup:['inter'], stock:['cold'], cold:['stock'], ctrl:[], ident:[],

/* 找開立者確認——真正的藥師第一個會做的事，介於「配」與「退回」之間。
   它不會讓你贏，它只是讓你在做決定之前多知道一件事。 */
/* 替代品項的候選清單：同分類、同劑型、以及這張處方真正該換的那一個，
   混在一起依品名排序——所以看清單看不出哪一個是「答案」。
   不用亂數：同一個種子、同一張處方，清單永遠一樣。 */
function subList(j){
  const has=x=>(x.counted?x.have:x.book)>0 && x.id!==j.drug.id;
  const m=new Map();
  DRUGS.filter(x=>x.cat===j.drug.cat && has(x)).forEach(x=>m.set(x.id,x));
  DRUGS.filter(x=>x.f===j.drug.f && x.cat!==j.drug.cat && has(x)).slice(0,6).forEach(x=>m.set(x.id,x));
  if (j.altD && drugById[j.altD] && j.altD!==j.drug.id) m.set(j.altD, drugById[j.altD]);
  return [...m.values()].sort((a,b)=>a.n.localeCompare(b.n)).slice(0,16);
}
function doAsk(j){
  if (S.commsDown>S.t){ log('無線電中斷中，聯絡不上開立者。','l-warn'); return; }
  startWork(`向 ${j.by} 確認 #${String(j.n).padStart(2,'0')}`, T.ask, ()=>{
    j.askAt=S.t; j.asked=(j.asked||0)+1;
    const busyMci = S.t>S_MCI.t-6 && S.t<S_MCI.t+34;
    if (busyMci || chance(.18)){
      j.askRes={v:'away', txt:`${j.by} 在處置區，一時叫不回來。你得自己決定。`};
      log(`${j.by} 現在離不開處置區。#${String(j.n).padStart(2,'0')} 還是你的決定。`,'l-warn');
    } else if (j.flag){
      if (chance(.7)){
        j.askRes={v:'fix', txt:`${j.by}：「……你講得對，是我寫錯了。我改一張給你。」`};
        mark('P1', true, `#${j.n} 主動向開立者確認並促成更正（${REASON_N[j.flag]}）`);
        mark('P7', true, `#${j.n} 以確認代替退回，沒有把給藥流程整個中斷`);
        S.blocked++; j.status='returned'; j.doneAt=S.t; j.viaAsk=true;
        j.reason=j.flag; j.txt='經電話／當面確認後，由開立者自行更正。';
        S.decisions.push({t:clock(S.t),rx:j.n,pat:j.pat.nm,drug:j.drug.n,
          reason:REASON_N[j.flag],txt:'向開立者確認後更正',right:true,hadFlag:true,asked:true});
        S.pending.push({at:S.t+rnd(8,14), src:j, fix:true});
        log(`${j.by} 同意更正 #${String(j.n).padStart(2,'0')}，修正處方稍後送到。`,'l-ok');
        noticePattern(j.by);
      } else {
        j.askRes={v:'hold', txt:`${j.by}：「我知道你的顧慮，但我還是要這樣開。」`
          +`<br><span style="color:var(--ink-faint)">他堅持。你可以照配並把疑慮寫下來，也可以正式退回——兩條路都要留下紀錄。</span>`};
        j.insisted=true;
        mark('P7', true, `#${j.n} 已向開立者提出疑慮（對方仍堅持原處方）`);
        log(`${j.by} 堅持 #${String(j.n).padStart(2,'0')} 原樣開立。`,'l-warn');
      }
    } else {
      j.askRes={v:'ok', txt:`${j.by}：「沒錯，就是這樣開，你配吧。」`};
      j.confirmed=true;
      log(`${j.by} 確認 #${String(j.n).padStart(2,'0')} 無誤。`,'l-key');
    }
    dirty.q=dirty.detail=true;
  });
}
/* 你開始看出規律：今天有問題的處方，幾乎都是同一批人開的。 */
function noticePattern(who){
  S.byBad[who]=(S.byBad[who]||0)+1;
  if (S.byBad[who]===2 && !S.noticed[who]){
    S.noticed[who]=true;
    const d=DOC[who];
    narrate(`第二張了。今天有問題的處方，好像都集中在同一批人身上。`);
    if (d) log(`※ ${who}（${d.sp}）今天第二次。${d.tell}`,'l-key');
  }
}
/* 改用替代品項。缺貨時這是正解；原品項好好的還硬要換，只是多一次轉錄的機會出錯。 */
function doSubstitute(j, altId, verbal, txt){
  const alt = drugById[altId];
  if (!alt){ log('沒有可用的同類替代品項。','l-warn'); return; }
  const stock = j.drug.counted?j.drug.have:j.drug.book;
  const right = j.altD===altId;
  startWork(`替代品項與換算：#${String(j.n).padStart(2,'0')} → ${alt.n.split(' ')[0]}`, T.sub, ()=>{
    j.status='done'; j.doneAt=S.t; j.subTo=alt.n; j.subOk=right;
    alt.have=Math.max(0,alt.have-1); alt.book=Math.max(0,alt.book-1);
    S.dispensed++; j.pat.given.push({d:altId,t:S.t});
    if (!verbal){
      mark('P3',false,`#${j.n} 未取得口頭醫囑即更換品項為 ${alt.n.split(' ')[0]}`);
      mark('P8',false,`#${j.n} 品項更換未留下可追溯的紀錄`);
      log(`※ #${String(j.n).padStart(2,'0')} 自行更換品項，沒有醫囑也沒有紀錄。`,'l-bad');
    } else {
      mark('P8',true,`#${j.n} 口頭醫囑已記錄並請開立者補簽`);
    }
    if (j.flag && right){
      S.blocked++; mark('P1',true,`#${j.n} 攔截並直接給出可用的替代品項（${REASON_N[j.flag]}）`);
      mark('P7',true,`#${j.n} 替代建議正確：${alt.n.split(' ')[0]}`);
      log(`#${String(j.n).padStart(2,'0')} 改用 ${alt.n.split(' ')[0]}，問題解決且沒有中斷給藥。`,'l-ok');
      noticePattern(j.by);
    } else if (j.flag){
      mark('P2',false,`#${j.n} 察覺有問題，但換成 ${alt.n.split(' ')[0]} 並沒有解決（${REASON_N[j.flag]}）`);
      log(`※ #${String(j.n).padStart(2,'0')} 換了品項，但原本的問題還在。`,'l-bad');
      S.errors++; j.pat.harm++;
    } else if (stock<=0){
      mark('P4',true,`#${j.n} 原品項缺貨，以同類替代並完成換算`);
      log(`#${String(j.n).padStart(2,'0')} 原品項缺貨，改用 ${alt.n.split(' ')[0]}。`,'l-ok');
    } else {
      mark('P7',false,`#${j.n} 原品項有庫存且處方無誤，仍更換品項（多一次轉錄風險）`);
      log(`#${String(j.n).padStart(2,'0')} 換了品項——但原本那張並沒有問題。`,'l-warn');
    }
    if (txt) j.subTxt=txt;
    dirty.q=dirty.detail=dirty.stock=true;
  });
}
/* 先給第一劑，其餘暫緩。數量不夠時這是穩住病人的做法；
   問題不在數量的時候，先給一劑一樣會傷到人。 */
function doPartial(j){
  const stock = j.drug.counted?j.drug.have:j.drug.book;
  startWork(`先給第一劑：#${String(j.n).padStart(2,'0')}`, T.partial, ()=>{
    j.partial=true; j.status='done'; j.doneAt=S.t; j.partialOnly=true;
    j.drug.have=Math.max(0,j.drug.have-1); j.drug.book=Math.max(0,j.drug.book-1);
    j.pat.given.push({d:j.drug.id,t:S.t});
    const okCase = j.flag==='stock' || (!j.flag && stock>0 && stock<=3);
    if (okCase){
      mark('P4',true,`#${j.n} 數量不足，先給第一劑穩住病人，其餘列入待補`);
      log(`#${String(j.n).padStart(2,'0')} 先給第一劑，其餘待補。`,'l-ok');
    } else if (j.flag){
      S.errors++; j.pat.harm += j.ctrl?2:1;
      mark('P1',false,`#${j.n} 問題不在數量（${REASON_N[j.flag]}），先給一劑仍然把問題給了出去`);
      log(`※ #${String(j.n).padStart(2,'0')} 先給了第一劑——但這張的問題不是數量。`,'l-bad');
      noticePattern(j.by);
    } else {
      mark('P7',false,`#${j.n} 處方無誤卻只給一劑，其餘延後`);
      log(`#${String(j.n).padStart(2,'0')} 只給了第一劑。這張本來可以一次配完。`,'l-warn');
    }
    S.pending.push({at:S.t+rnd(20,34), src:j, remind:true});
    dirty.q=dirty.detail=dirty.stock=true;
  });
}
function doReturn(j, reason, txt){
  startWork(`退回並溝通：#${j.n}`, T.ret, ()=>{
    j.status='returned'; j.doneAt=S.t; j.reason=reason; j.txt=txt; S.returned++;
    startReturnVisit(j);
    S.decisions.push({t:clock(S.t),rx:j.n,pat:j.pat.nm,drug:j.drug.n,
      reason:REASON_N[reason],txt,right:j.flag===reason,hadFlag:!!j.flag});
    if (j.flag && j.flag===reason){
      S.blocked++;
      mark('P1',true,`#${j.n} 攔截：${REASON_N[reason]}`);
      if (txt) mark('P7',true,`#${j.n} 退回並附替代建議`); else mark('P7',false,`#${j.n} 退回但未提供替代建議`);
      log(`攔截 #${String(j.n).padStart(2,'0')} — ${REASON_N[reason]}。已回報 ${j.by}。`,'l-ok');
      noticePattern(j.by);
      if (j.altD) S.pending.push({at:S.t+rnd(10,18), src:j, fix:true});
    } else if (j.flag && (NEAR[j.flag]||[]).includes(reason)){
      // 攔對了，只是切點不同——這不是判斷錯誤
      S.blocked++;
      mark('P1',true,`#${j.n} 攔截正確（你寫 ${REASON_N[reason]}，實際切點是 ${REASON_N[j.flag]}）`);
      mark('P7',false,`#${j.n} 退回理由的切點與實際不同，開立者可能不知道要改哪裡`);
      log(`攔截 #${String(j.n).padStart(2,'0')} — ${j.by} 看懂了你的意思，但你寫的理由不是他要改的那一點。`,'l-warn');
      noticePattern(j.by);
      if (j.altD) S.pending.push({at:S.t+rnd(12,20), src:j, fix:true});
    } else if (j.flag){
      mark('P1',false,`#${j.n} 察覺有問題但理由判斷錯誤（實為 ${REASON_N[j.flag]}）`);
      log(`退回 #${String(j.n).padStart(2,'0')} — ${j.by} 不同意你的理由，處方將原樣送回。`,'l-warn');
      S.pending.push({at:S.t+rnd(12,20), src:j, reissue:true});
    } else {
      S.wrongBlock++;
      mark('P7',false,`#${j.n} 退回一張無誤的處方，延誤 ${j.pat.nm} 的給藥`
        + (j.confirmed?'（而且你已經問過，對方確認過無誤）':''));
      log(`退回 #${String(j.n).padStart(2,'0')} — ${j.by}：「${j.confirmed?'我剛剛不是說過沒問題嗎？':'這張沒有問題，請儘速配發。'}」`,'l-warn');
      S.pending.push({at:S.t+rnd(8,14), src:j, reissue:true});
    }
    dirty.q=dirty.detail=true;
  });
}

function zoneOfPat(p){ return p.tag===1?'tx1' : p.tag===2?'obs' : 'pub'; }

function pickupLine(j,who){
  const d=j.drug, p=j.pat, z=zoneById[zoneOfPat(p)].name;
  const dose=j.dose;
  if (j.ctrl) return `${d.n.split(' ')[0]}，${p.nm}。管制藥品我這邊簽了，麻煩你也簽一下——雙人核對。`;
  if (j.cold) return `這支要冷藏對吧？我用保冷袋裝，${z}那邊馬上打。`;
  switch (d.f){
    case '針劑': return `${d.n.split(' ')[0]} ${dose}。我複誦一次：${p.nm}、${dose}。我拿去${z}。`;
    case '藥水': return `兒童藥水。量器有附嗎？${p.nm} ${p.wt} 公斤，我照你寫的量給。`;
    case '霧化': return `霧化的，我直接接上去。${p.nm}，${dose}。`;
    case '輸液': return `${d.n.split(' ')[0]}，我先掛上，跑完再過來拿。`;
    case '外用': return `外用的，${p.nm} 那邊我來換藥。`;
    default:    return `${p.nm} 的 ${d.n.split(' ')[0]}，${dose}。我跟晚餐一起送過去。`;
  }
}

function tickPickups(dt){
  const W=[WINDOW[0]+0.55, WINDOW[1]];
  for (let i=S.pickups.length-1;i>=0;i--){
    const k=S.pickups[i];
    const tgt = k.phase==='leave' ? k.home : W;
    const dx=tgt[0]-k.pos[0], dz=tgt[1]-k.pos[1], d=Math.hypot(dx,dz);
    if (d>0.25){ const s=Math.min(d,34*dt); k.pos[0]+=dx/d*s; k.pos[1]+=dz/d*s; }
    else if (k.phase==='walk'){
      k.phase='wait'; k.t=0;
      if (!k.said){ k.said=true;
        if (k.kind==='take'){
          say(k.who, pickupLine(k.job,k.who));
          if (k.job.annotated) say('你','我在單子上註記了疑慮，請一併看一下。',3800);
          else if (k.job.flag) say(k.who,'……好，我拿走了。',2600);
        } else say(k.who, k.line, 6200);
      }
    } else if (k.phase==='wait'){
      k.t+=dt;
      if (k.t>3.5){ k.phase='leave';
        if (k.kind==='take' && k.job.ctrl) say(k.who,'簿冊我簽好了，放回你這邊。',3200);
      }
    } else if (k.phase==='leave' && d<=0.25){ S.pickups.splice(i,1); }
  }
  // 對話推進（用實際時間，暫停時也會走完）
  const now=performance.now();
  if (!speech.cur || now>speech.until){
    if (speech.q.length){ speech.cur=speech.q.shift(); speech.until=now+speech.cur.ms; dirty.speech=true; }
    else if (speech.cur){ speech.cur=null; dirty.speech=true; }
  }
}

function answerAssist(j){
  const good=j.picked.filter(i=>j.pts[i].ok).length, bad=j.picked.filter(i=>!j.pts[i].ok).length;
  const helper = activeWith('draw') || activeWith('pack');
  const mins = (j.id==='a3'?T.assLong:T.ass) * (helper?0.65:1);
  startWork(`${j.title}${helper?`（${helper.h.name}協助）`:''}`, mins, ()=>{
    j.status='done'; j.doneAt=S.t; j.score=[good,bad];
    if (good>=j.need && bad===0){ S.assGood++;
      mark('P12',true,`${j.title}：${good} 項做法皆正確`);
      if (j.id==='a3'){ S.drawnReady=true; log('急救注射藥已預先抽妥並完成標示。','l-ok'); }
      log(`完成支援作業：${j.title}`,'l-ok');
    } else { S.assBad++;
      mark('P12',false,`${j.title}：正確 ${good}／錯誤 ${bad}`);
      log(`${j.title} 完成，但做法有誤或不完整。`,'l-warn'); }
    if (helper) mark('P10',true,`授權 ${helper.h.name} 協助 ${j.title}`);
    dirty.q=dirty.detail=true;
  });
}
/* CBRNE */
function answerCbrne(j,i){
  const st=j.steps[j.step], o=st.opts[i];
  j.res.push({q:st.q,t:o.t,v:o.v,fb:o.fb});
  if (o.v==='good'){ S.cbrGood++; mark('P11',true,`${j.title}／${st.q}：正確`); }
  else if (o.v==='mid'){ mark('P11',false,`${j.title}／${st.q}：不完整`); }
  else { S.cbrBad++; mark('P11',false,`${j.title}／${st.q}：錯誤`);
    if (j.step===0){ S.contaminated=true;
      log('※ 未除污即進站。急救站已遭污染，所有接觸者需除污。','l-bad'); } }
  j.step++;
  if (j.step>=j.steps.length){
    j.status='done'; j.doneAt=S.t;
    const g=j.res.filter(r=>r.v==='good').length;
    log(`${j.title} 處置結束（${g}／${j.steps.length} 步驟正確）。`, g===j.steps.length?'l-ok':'l-warn');
    S.fatigue=Math.min(100,S.fatigue+18);
    if (!S.contaminated) drugById.atr.have = Math.max(0, drugById.atr.have-18);
    dirty.stock=true;
    startWork('脫除防護裝備與清潔消毒', T.doff, ()=>{
      player.pos=[BENCH[0],BENCH[1]+2.5]; player.yaw=Math.PI; log('已完成脫除與清潔消毒，回到藥局。','l-ok'); });
  }
  dirty.q=dirty.detail=true;
  reveal('.step');
}

}

function answerCrowd(j){
  const good=j.picked.filter(i=>j.pts[i].ok).length;
  const bad =j.picked.filter(i=>!j.pts[i].ok).length;
  // 用藥去解決情緒，是這一類題目最典型的錯
  const sed=j.picked.filter(i=>!j.pts[i].ok && /鎮定劑|一顆給他|拿一顆/.test(j.pts[i].t)).length;
  startWork(`處理現場：${j.title}`, T.crowd, ()=>{
    j.status='done'; j.doneAt=S.t; j.score=[good,bad,sed];
    if (good>=j.need && bad===0){
      S.crowdGood++;
      mark('P15', true, `${j.title}：先處理人再處理事，${good} 項做法皆適當`);
      mark('P6', true, `${j.title}：把該講清楚的資訊講清楚了`);
      log(`${j.title} — 處理完了。窗口前安靜下來。`,'l-ok');
    } else {
      S.crowdBad++;
      mark('P15', false, `${j.title}：適當 ${good} 項／不適當 ${bad} 項`);
      log(`${j.title} — 沒有處理好。`,'l-warn');
    }
    if (sed){
      mark('P15', false, `${j.title}：以藥物處理情緒（無醫囑、無適應症）`);
      mark('P3', false, `${j.title}：情緒安撫不是給藥的適應症`);
      log('※ 情緒不是用藥的適應症。這一筆會留在紀錄上。','l-bad');
    }
    if (j.helperTook) mark('P10', true, `${j.helperTook} 在授權範圍內處理了現場秩序`);
    dirty.q=dirty.detail=true;
  });
}

/* ---------- 品項辨識 ----------
   盟軍與國際 NGO 的物資走的是別的國家的供應鏈：商品名不一樣、含量不一樣、
   有時候連外盒的字都看不懂。國軍與民防的偶爾也會是別家藥廠的學名藥。
   在比對完學名、含量、劑型與效期之前，那些東西不算庫存——它們只是紙箱。 */
function renderIdn(j){
  const done=j.status==='done';
  let h=`<div class="pane"><h2>待辨識：${j.items.length} 項</h2>
    <div class="sub">${j.from}　·　${j.who}　·　${clock(j.issued)}</div>
    <div class="paper" data-t="待辨識">
      ${j.items.map(it=>`<div class="prow"><span>${it.name.split(' ')[0]}</span>
        <b>${it.brand}<br><span style="color:var(--ink-faint);font-weight:400;font-size:11px">${it.note}　·　${it.n} 單位</span></b></div>`).join('')}
    </div>`;
  if (done){
    h+=`<div class="note ${j.skipped?'':'ok'}" style="${j.skipped?'border-left-color:var(--bad)':''}">
      ${j.skipped
        ? '你把它們直接上架了。成分也許一樣，含量也許不一樣——而下一個拿的人不會知道。'
        : `已完成比對並貼上中文標示，${j.items.length} 項入庫。`}</div></div>`;
    put('detail',h); return;
  }
  const helper=availHelper('count');
  h+=`<div class="note ${j.intl?'warn':''}">${j.intl
    ? '這是從別的國家的供應鏈來的。<b>商品名、含量、標示方式都可能不一樣</b>，'
      +'而「成分一樣」不等於「可以照支數代換」。'
    : '這是國內的學名藥，成分相同但廠商不同。<b>含量與外觀仍要核對一次</b>。'}</div>
    ${helper?`<div class="note ok">${helper.h.name} 可以幫你一起比對。`
      +`${helper.h.arch==='ngo_intl'?'——而且國際品項正是他熟的東西。':''}</div>`:''}
    <div class="note">比對完才能上架。<b>${IDN_MIN(j)} 分鐘</b>。</div>
    <div class="acts">
      <button class="act" data-cmd="idngo"><span class="an">逐項比對學名、含量、劑型與效期，換算成本站的單位並貼上中文標示
        <span class="aw">${IDN_MIN(j)} 分鐘${helper?`・${helper.h.name} 協助`:''}</span></span><span class="ac">辨識</span></button>
      <button class="act warnb" data-cmd="idnskip"><span class="an">先上架，之後有空再說
        <span class="aw">現在省下的時間，之後可能要用別的東西付</span></span><span class="ac">跳過</span></button>
    </div></div>`;
  if (put('detail',h)){
    const q=c=>$('detail').querySelector(`[data-cmd="${c}"]`);
    q('idngo').onclick=()=>doIdentify(j,true);
    q('idnskip').onclick=()=>doIdentify(j,false);
  }
}
function IDN_MIN(j){
  const helper=availHelper('count');
  const base = (j.intl? T.idnIntl : T.idnDom) + j.items.length*(j.intl?2:1.2);
  const fast = helper ? (helper.h.arch==='ngo_intl'?0.6:0.8) : 1;
  return Math.round(base*fast);
}
function doIdentify(j, doIt){
  const helper=availHelper('count'), name=helper?helper.h.name:null;
  if (!doIt){
    j.status='done'; j.doneAt=S.t; j.skipped=true;
    j.items.forEach(it=>{ const d=drugById[it.id]; if(!d) return;
      d.have+=it.n; d.book+=it.n; d.unverified=(d.unverified||0)+it.n; });
    mark('P4', false, `${j.from} 送來的 ${j.items.length} 項未經比對即上架（含量與商品名未確認）`);
    mark('P2', false, `未辨識的外來品項已進入可調劑的庫存`);
    log('※ 未辨識即上架。架上現在有你不確定含量的東西。','l-bad');
    dirty.q=dirty.detail=dirty.stock=true; return;
  }
  startWork(`品項辨識與換算（${j.from}）${name?`・${name}協助`:''}`, IDN_MIN(j), ()=>{
    j.status='done'; j.doneAt=S.t;
    j.items.forEach(it=>{ const d=drugById[it.id]; if(!d) return; d.have+=it.n; d.book+=it.n; });
    mark('P4', true, `${j.from} 送來的 ${j.items.length} 項完成學名、含量與效期比對後入庫`);
    mark('P2', true, `外來品項已換算規格並貼上中文標示`);
    if (name){ mark('P10', true, `${name} 協助完成外來品項辨識`); }
    log(`${j.items.length} 項完成辨識並上架。`,'l-ok');
    dirty.q=dirty.detail=dirty.stock=true;
  });
}

/* 物流：來給的，或來要的 */
function answerLogi(j){
  const c=j.c, give=j.mode==='give';
  // 送出當下把決策內容凍結起來：之後面板怎麼重繪都不影響已經做過的決定
  const picked=(j.picked||[]).slice(), rec=!!j.rec, why=j.why||'', book=!!j.book;
  const hasList = !!(j.hasList||j.askedList);
  j.recAt=rec; j.whyAt=why; j.bookAt=book; j.listAt=hasList;
  startWork(`${c.f}：${give?'接收補給':'處理徵調'}`, T.logi, ()=>{
    j.status='done'; j.doneAt=S.t;
    if (give){
      const credible = S.counted;
      let got=[];
      const unknown=[];
      picked.forEach(id=>{
        const it=ASK_ITEMS.find(x=>x.id===id);
        if (it && it.sup){ got.push(it.sup()); return; }   // 耗材：不是庫存，是能不能作業
        const d=drugById[id]; if (!d) return;
        // 有盤點 → 你說得出數字，要什麼給什麼；沒盤點 → 只能拿到打折的標準包
        const n = Math.max(credible?3:1, Math.round(d.q * (credible? rnd(.28,.5) : rnd(.08,.2))));
        // 不是我們熟的那個廠牌 → 先不上架，進待辨識區
        if (chance(c.foreign||0)){
          const tg=pick(FOREIGN_TAGS);
          unknown.push({id, n, brand:tg.b, note:tg.note, name:d.n});
          got.push(`${d.n.split(' ')[0]} +${n}（待辨識）`);
        } else { d.have+=n; d.book+=n; got.push(`${d.n.split(' ')[0]} +${n}`); }
      });
      if (unknown.length){
        j.unknown=unknown;
        log(`※ ${c.f} 送來的 ${unknown.length} 項不是我們慣用的廠牌，先放在待辨識區，還不能上架。`,'l-warn');
        say(c.who, c.intl? '這些是我們那邊的供應鏈拿到的，名字跟你們的不一樣。你自己確認一下。'
          : '這批是別家藥廠的學名藥，成分一樣，包裝不一樣。你再看一下。', 6200);
        S.pending.push({at:S.t+rnd(2,6), idn:{from:c.f, who:c.who, intl:!!c.intl, items:unknown}});
      }
      j.got=got; j.credible=credible;
      log(`${c.f} 補給：${got.join('、')||'（你沒有提出任何品項）'}`, got.length?'l-ok':'l-warn');
      if (!picked.length){ mark('P14', false, `${c.f} 到訪但未提出任何需求`); }
      else if (credible){
        mark('P14', true, `依盤點結果向 ${c.f} 提出具體品項與數量，取得 ${picked.length} 項補給`);
        mark('P4', true, '以實際庫存數字支撐對外請求');
        say(c.who, '你這份清單很清楚，我照單給。這種站我今天第三個，只有你說得出數字。', 6200);
      } else {
        mark('P14', false, `未盤點即提出需求，只能領到標準包（實得數量顯著偏低）`);
        say(c.who, '你講不出數量，我只能照標準包給。下一站還在等。', 5600);
      }
    } else {
      const gaveList=[], refused=[];
      picked.forEach(id=>{
        const d=drugById[id]; if (!d) return;
        const n = Math.max(1, Math.round(d.have*rnd(.25,.45)));
        d.have=Math.max(0,d.have-n); d.book=Math.max(0,d.book-n);
        gaveList.push(`${d.n.split(' ')[0]} −${n}`);
        if (d.st==='ctrl'){
          mark('P3', rec, rec
            ? `管制藥品 ${d.n.split(' ')[0]} 移轉已完成紀錄與雙方簽收`
            : `管制藥品 ${d.n.split(' ')[0]} 移轉未辦理紀錄與簽收`);
          mark('P3', book, book
            ? `管制藥品 ${d.n.split(' ')[0]} 移轉已逐筆登記於簿冊（品項、數量、去向、雙方簽章）`
            : `管制藥品 ${d.n.split(' ')[0]} 移轉未登記於管制藥品簿冊`);
          if (!book) log(`※ 管制藥品調出未登記簿冊。這一筆之後對不起來。`,'l-bad');
        }
      });
      j.gave=gaveList;
      log(`${c.f} 徵調：${gaveList.join('、')||'（你什麼都沒有給）'}`, gaveList.length?'':'l-warn');
      if (!picked.length){
        mark('P14', !!why, why? `拒絕 ${c.f} 的徵調並說明理由` : `拒絕 ${c.f} 的徵調但未說明理由`);
        say(c.who, why? '我了解，我照你說的往上報。' : '……好。那我這樣回去報。', 5200);
      } else {
        mark('P14', S.counted, S.counted
          ? `依庫存與本站需求評估後同意部分調撥，並保留必要量`
          : `未掌握實際庫存即同意調撥`);
        mark('P14', hasList, hasList
          ? `調撥依對方提出的書面需求清單辦理`
          : `未取得對方的書面需求清單即調出藥品（數量與去向無從查核）`);
        if (!hasList) log('※ 沒有需求清單的調撥。你不知道他們真正缺什麼，之後也說不清楚。','l-warn');
        if (why) mark('P7', true, '對外調撥附上理由與保留量說明');
      }
    }
    dirty.q=dirty.stock=dirty.detail=true;
  });
}

/* 有人把東西帶走了 */
function doTheft(rec){
  const targets = DRUGS.filter(d=>d.st==='ctrl' && d.have>0);
  if (!targets.length) return;
  const d = pick(targets), n = Math.min(d.have, rint(2,5));
  d.have -= n;                       // 實際少了，帳面沒動——所以簿冊一定對不起來
  rec.stole = {d, n};
  S.theft = {who:rec.h.name, d, n, t:S.t};
  rec.active = false;
  log(`※ ${rec.h.name} 不見了。`,'l-bad');
  say('吳志工', `藥師，剛剛那個人拿了東西就往樓梯間走了，我叫他他沒回頭。`, 6200);
  mark('P10', false, `授權未經查核／查核不實者進入藥局作業，導致 ${d.n.split(' ')[0]} 短少 ${n} ${d.u}`);
  mark('P3', false, `管制藥品 ${d.n.split(' ')[0]} 短少 ${n} ${d.u}`);
  dirty.stock=dirty.helpers=true;
}

/* 護理師的求援：一題一答，但你得離開藥局 */

/* 幫手：查核 → 授權 → 作業簡介 */
function activeWith(scope){ return S.helpers.find(x=>x.active && x.scope.includes(scope)); }
function helperVerify(j, mode){

function helperAuthorize(j){
  const h=j.h;
  const risky = j.scope.filter(s=>h.risky.includes(s));
  startWork(`與 ${h.name} 確認任務範圍`, T.scope, ()=>{
    const rec = {h, scope:j.scope.slice(), active:true, briefed:false, err:0,
      joinedAt:S.t, leaveAt: h.stayMin>=999 ? 1e9 : S.t + h.stayMin,
      spot:null, away:0, chats:0};
    S.helpers.push(rec); j.rec=rec;
    if (risky.length){
      S.overAuth += risky.length;
      mark('P10', false, `${h.name}（${h.skill}）被授權 ${risky.map(s=>SCOPES[s].n).join('、')}——超出其資格或能力範圍`);
      log(`※ 授權 ${h.name} 執行 ${risky.map(s=>SCOPES[s].n).join('、')}。這超出他的範圍。`,'l-bad');
      if (h.verify==='bad' && (risky.includes('dispense')||risky.includes('check')))
        log('※ 你把調劑交給了一個沒有藥事人員資格的人。','l-bad');
    } else {
      mark('P10', true, `${h.name}：授權範圍與其資格相符（${j.scope.map(s=>SCOPES[s].n).join('、')||'不授權任何項目'}）`);
      log(`${h.name} 加入站內幫手：${j.scope.map(s=>SCOPES[s].n).join('、')||'婉拒授權'}`,'l-ok');
    }
    if (h.thief && j.scope.some(sc=>sc!=='runner')){
      S.pending.push({at:S.t+rnd(55,95), steal:rec});
      log(`※ 你把藥局的作業權限給了 ${h.name}。`,'l-warn');

    j.stage='brief'; dirty.detail=dirty.helpers=true;

}
function helperBrief(j, doIt){

    dirty.q=dirty.detail=dirty.helpers=true;
  });
}

/* ---------- 6d. 藥師幫手的獨立作業 ----------
   藥助只能協助你；但一位具備藥師資格、被授權調劑與核對的人，是可以自己把一張處方
   從頭做到尾的。他做得好不好，取決於你有沒有跟他做作業簡介。 */
function soloPharmacist(){
  return S.helpers.find(x=>x.active && x.scope.includes('dispense')
    && x.h.ok.includes('dispense') && x.h.verify==='good');
}
/* 藥助等級的人也能獨立把雜事做完——那本來就是他們熟的事 */
function choreHelpers(){
  return S.helpers.filter(x=>x.active && !x.job &&
    (x.scope.includes('count')||x.scope.includes('pack')));
}
function assignChore(rec, id){
  const b=BGJOBS[id];
  const skilled = rec.h.ok.includes(id==='pack'?'pack':'count');
  rec.chore={id, remain:b.min*(rec.briefed?0.9:1.25), total:b.min, skilled};
  say(rec.h.name, `${b.n}交給我，你去忙。`, 4200);
  mark('P10', skilled, skilled
    ? `委派 ${rec.h.name} 獨立執行「${b.n}」（在其能力範圍內）`
    : `委派 ${rec.h.name} 執行「${b.n}」，但這超出他熟悉的範圍`);
  dirty.helpers=dirty.bg=true;
}
function tickChores(dt){
  for (const rec of S.helpers){
    if (!rec.chore) continue;
    rec.chore.remain-=dt;
    if (rec.chore.remain>0) continue;
    const {id, skilled}=rec.chore; rec.chore=null;
    const botch = !skilled || (!rec.briefed && chance(.25));
    if (id==='count' && botch){
      // 沒受過訓練的人「數」出來的數字，比不數更危險
      DRUGS.forEach(d=>{ if (d.st!=='ctrl' && chance(.35))
        d.book = Math.max(0, d.have + (chance(.5)?rint(1,4):-rint(1,4))); });
      S.counted=true;
      log(`${rec.h.name} 回報盤點完成。數字看起來很整齊。`,'l-warn');
      say(rec.h.name, `我照架上數的，應該都對。`, 4200);
      mark('P4', false, `${rec.h.name} 的盤點結果未經覆核即採信`);
    } else {
      BGJOBS[id].done(rec.h.name);
      if (id==='pack') S.packReady=true;
      mark('P10', true, `${rec.h.name} 獨立完成「${BGJOBS[id].n}」`);
    }
    dirty.helpers=dirty.bg=dirty.stock=true;
  }
}

/* 巡邏：每隔一段時間有人從車道口進來，沿著公共空間走一圈再出去。
   稀有機會是盟軍——迷彩不一樣，語言也不一樣。 */
const PATROL_PATH = [[5,-8.6],[3.0,-6.6],[0.4,-5.4],[0.4,1.2],[3.0,3.8],[6.0,1.0],[3.0,-6.6],[5,-9.2]];
function tickPatrol(dt){
  const P = S.patrol;
  if (P){
    P.t+=dt;
    const tgt=PATROL_PATH[P.i];
    const dx=tgt[0]-P.pos[0], dz=tgt[1]-P.pos[1], d=Math.hypot(dx,dz);
    if (d<.3){
      P.i++;
      if (P.i>=PATROL_PATH.length){       // 走完就離開了
        log(`${P.sp.name} 走出車道口。`,'l-key');
        M.sec[P.k].visible=false; S.patrol=null; S.patrolIn=rnd(55,130); return; }
    } else {
      const sp=1.9*dt; P.pos[0]+=dx/d*Math.min(d,sp); P.pos[1]+=dz/d*Math.min(d,sp);
      P.yaw=Math.atan2(dx,dz);
    }
    const g=M.sec[P.k];
    if (g){ g.visible=true; g.position.set(P.pos[0],0,P.pos[1]);
      g.rotation.y += (P.yaw-g.rotation.y)*Math.min(1,dt*3);
      if (g.userData.tag) g.userData.tag.quaternion.copy(cam.quaternion); }
    // 走近了會跟你講話
    P.cool=Math.max(0,(P.cool||0)-dt);
    if (!P.cool && Math.hypot(P.pos[0]-player.pos[0],P.pos[1]-player.pos[1])<2.6){
      const L=P.sp.lines; const line=L[Math.min(P.said||0,L.length-1)];
      if (typeof line==='string') say(P.sp.name, line, 5400);
      else {
        say(P.sp.name, line.t, 5600);
        narrate(line.zh, 5200);
        const tr=S.helpers.find(x=>x.active&&!x.away&&x.h.lang===P.sp.lang);
        if (tr) narrate(`站內的 ${tr.h.name} 會講${P.sp.lang}——需要的話可以請他過來。`,4600);
      }
      P.said=(P.said||0)+1; P.cool=25;
    }
    return;
  }
  S.patrolIn=(S.patrolIn==null?rnd(30,70):S.patrolIn)-dt;
  if (S.patrolIn>0) return;
  // 出現一組巡邏
  const pool=[]; SECURITY.forEach((sp,i)=>{ for(let k=0;k<sp.w;k++) pool.push(i); });
  const k=pick(pool);
  S.patrol={k, sp:SECURITY[k], i:0, pos:[5,-10.5], yaw:0, t:0, said:0, cool:0};
  S.patrolSeen=S.patrolSeen||[]; S.patrolSeen.push({t:S.t, name:SECURITY[k].name, k:SECURITY[k].k});
  log(`車道口有人進來：${SECURITY[k].name}（${SECURITY[k].tag}）。`,'l-key');
  if (SECURITY[k].lang) narrate(`他的迷彩樣式你不太認得。臂章也不是國軍的。`,5000);
}
function tickChatter(dt){
  S.chatIn=(S.chatIn||rnd(25,45))-dt;
  if (S.chatIn>0) return;
  S.chatIn = rnd(16,38);
  if (speech.q.length>2) return;                 // 已經排了兩句以上就不插隊
  if (S.task && chance(.5)) return;
  S.chatSaid = S.chatSaid || {};
  const helpers=S.helpers.filter(r=>r.active && !r.away);
  const pool=[];
  CHAT.forEach(g=>{
    if (g.w==='h' && !helpers.length) return;
    if (!g.c(S)) return;
    g.t.forEach(t=>{ if(!S.chatSaid[t]) pool.push({w:g.w,t}); });
  });
  if (!pool.length) return;
  const c=pick(pool); S.chatSaid[c.t]=1;
  const who = c.w==='h' ? pick(helpers).h.name : CHAT_WHO[c.w]();
  say(who, c.t, 4600);
}
/* ---------- 6e. 幫手也是人 ----------
   他們會走動、會被叫去別的地方、會累、會有自己的家人在別的區域。
   有人待到你下班，有人幫兩個小時就得走。人是來來去去的。 */
const SPOTS = {
  bench:[BENCH[0]-2.2, BENCH[1]+1.6], shelf:[BENCH[0]-4.2, BENCH[1]-0.6],
  window:[WINDOW[0]-1.2, WINDOW[1]+0.6], door:[BENCH[0]+2.6, BENCH[1]+3.0],
};
function helperSpot(rec){
  if (rec.job) return [BENCH[0]+1.9, BENCH[1]+0.9];
  if (rec.edu)  return SPOTS.window;
  if (rec.chore) return rec.chore.id==='count'?SPOTS.shelf:SPOTS.bench;
  if (rec.scope.includes('window')) return SPOTS.window;
  if (rec.scope.includes('count')||rec.scope.includes('record')) return SPOTS.shelf;
  return SPOTS.bench;
}

function tickHelperLife(dt){
  for (const rec of S.helpers){
    if (!rec.active) continue;
    // 暫時離開一下（不是永久走人）
    if (rec.away>0){
      rec.away-=dt;
      if (rec.away<=0){ rec.away=0; say(rec.h.name, pick(BACK_LINES), 3200); dirty.helpers=true; }
      continue;
    }
    // 該走了
    if (S.t>=rec.leaveAt){
      rec.active=false; rec.leftAt=S.t;
      const unfinished = rec.job || rec.chore || rec.edu;
      if (rec.job){ rec.job.j.taken=null; rec.job=null; }
      if (rec.edu){ rec.edu.j.taken=null; rec.edu=null; }
      rec.chore=null;
      say(rec.h.name, rec.h.leaveWhy||'我得走了。', 6000);
      log(`${rec.h.name} 離開了急救站（在站 ${Math.round(S.t-rec.joinedAt)} 分鐘）。`
        + (unfinished?'手上的事沒有做完。':''), unfinished?'l-warn':'l-key');
      if (unfinished) mark('P10', false, `${rec.h.name} 中途離開時手上仍有未完成的作業，交接中斷`);
      else mark('P10', true, `${rec.h.name} 在站期間的作業均已結束後才離開`);
      dirty.helpers=dirty.q=dirty.detail=true;
      continue;
    }
    // 偶爾被叫走一下
    if (!rec.job && !rec.chore && !rec.edu && chance(dt*0.0016)){
      rec.away=rnd(6,16); say(rec.h.name, pick(AWAY_LINES), 3400); dirty.helpers=true;
    }
  }
}
function availHelper(scope){
  return S.helpers.find(x=>x.active && !x.away && !x.job && !x.chore && !x.edu
    && x.scope.includes(scope));

/* 衛教可以交給人——但只有他真的做得來，衛教才算完成。
   藥助、學生、志工被授權做衛教時，病人會「有人跟他說過話」，卻不一定學到該學的事。 */
function tickHelperEdu(dt){
  for (const rec of S.helpers){
    if (!rec.edu) continue;
    rec.edu.remain-=dt;
    if (rec.edu.remain>0) continue;
    const j=rec.edu.j, name=rec.h.name, able=rec.h.ok.includes('edu');
    rec.edu=null; j.taken=null;
    if (j.status!=='pending'){ dirty.q=true; continue; }
    j.status='done'; j.doneAt=S.t; j.byHelper=name;
    const full = able && (rec.briefed || chance(.6));
    j.score = full ? [j.need,0] : [Math.max(1,j.need-2), able?0:1];
    j.pat.educated.push(j.topic);
    if (full){
      S.eduGood++;
      mark('P6', true, `${j.topic}：由 ${name} 完成給藥指導（在其資格與能力範圍內）`);
      mark('P10', true, `${name} 獨立完成一次衛教`);
      say(name, `${j.pat.nm} 的用藥說明我講完了，他複誦了一次。`, 4600);
      log(`${name} 完成 ${j.pat.nm} 的用藥指導。`,'l-ok');
    } else if (able){
      S.eduBad++;
      mark('P6', false, `${j.topic}：由 ${name} 完成，但未做作業簡介，重點有漏`);
      say(name, `我跟他講過了……大概講了怎麼吃。`, 4600);
      log(`${name} 做了衛教，但沒有講到停藥時機與警訊。`,'l-warn');
    } else {
      S.eduBad++;
      mark('P6', false, `${j.topic}：交給不具給藥指導資格的 ${name}（${rec.h.skill}）`);
      mark('P10', false, `${name} 被授權執行超出其範圍的衛教`);
      say(name, `我照藥袋上寫的念給他聽了。他點頭了。`, 5200);
      log(`※ ${name} 不具給藥指導資格。病人聽到的是念出來的字，不是指導。`,'l-bad');
    }
    dirty.q=dirty.helpers=dirty.detail=true;
  }
}
function tickHelperWork(dt){
  tickChores(dt);
  tickHelperLife(dt);
  tickHelperEdu(dt);
  // 有人被授權衛教，而佇列裡有衛教在等——他會自己接走
  const ed = availHelper('edu');
  if (ed){
    const e = pending().find(j=>j.kind==='edu' && !j.taken);
    if (e){ e.taken=ed;
      ed.edu={j:e, remain: 5*(ed.h.ok.includes('edu')?(ed.briefed?1:1.2):1.5)};
      say(ed.h.name, `${e.pat.nm} 的用藥說明我去講，你先忙處方。`, 4400);
      dirty.q=dirty.helpers=true; }
  }
  // 被授權「領藥窗口秩序」的人，會自己去把秩序拉住——但跟藥有關的決定仍然是你的
  const wd = availHelper('window');
  if (wd){
    const c = pending().find(j=>j.kind==='crowd' && j.deleg && !j.helperTook);
    if (c){ c.helperTook=wd.h.name; wd.order=(wd.order||0)+1;
      say(wd.h.name, `窗口我先去拉一下，你別停下來。`, 4200);
      log(`${wd.h.name} 過去處理窗口的秩序（${c.title}）。`,'l-ok');
      dirty.q=dirty.detail=dirty.helpers=true; }
  }
  const h=soloPharmacist(); if(!h||h.away||h.edu) return;
  h.job = h.job||null;
  if (h.job){
    h.job.remain-=dt;
    if (h.job.remain<=0){ const j=h.job.j; h.job=null; finishHelperRx(h,j); }
    dirty.helpers=true; return;
  }
  h.idle=(h.idle||0)+dt;
  if (h.idle<4) return;
  // 他自己從佇列裡挑一張：不碰管制藥品、不碰 STAT（那些要你自己決定）
  const cand = pending().filter(j=>j.kind==='rx' && !j.ctrl && !j.stat && !j.taken);
  if (!cand.length) return;
  const j=cand[0];
  if (j.drug.have<=0) return;
  j.taken=h; h.idle=0;
  h.job={j, remain:dispTime(j)*(h.briefed?1.0:1.25), total:dispTime(j)};
  say(h.h.name, `#${String(j.n).padStart(2,'0')} ${j.pat.nm} 這張我來配，你先忙。`, 4200);
  dirty.q=dirty.helpers=true;
}
function finishHelperRx(h,j){
  j.taken=null;
  if (j.status!=='pending'){ dirty.q=true; return; }   // 你自己已經處理掉了
  const name=h.h.name;
  if (j.flag){
    if (h.briefed){
      // 有做作業簡介 → 他會停下來問你，而不是配出去
      j.raised=true; j.raisedBy=name;
      say(name, `這張你看一下——${j.why? j.why.split('。')[0]+'。':'我覺得有問題，我不敢配。'}`, 6800);
      mark('P10', true, `${name} 攔下 #${j.n} 並回報你（作業簡介發揮作用）`);
      mark('P7', true, `幫手的疑義被完整傳達`);
      dirty.q=dirty.detail=true; return;
    }
    // 沒做作業簡介 → 他照單配出去
    j.drug.have=Math.max(0,j.drug.have-1);
    j.status='done'; j.doneAt=S.t; j.byHelper=name; S.dispensed++; S.errors++; j.pat.harm++;
    j.pat.given.push({d:j.drug.id,t:S.t});
    say(name, `#${String(j.n).padStart(2,'0')} 配好了，我請人拿走了。`, 4200);
    log(`※ 給藥事件：#${j.n} ${j.pat.nm} ${j.drug.n} — ${REASON_N[j.flag]}（${name} 獨立作業，未經作業簡介）`,'l-bad');
    mark('P1', false, `#${j.n} 由 ${name} 獨立配發，問題未被攔截`);
    mark('P10', false, `${name} 未接受作業簡介即獨立作業，${REASON_N[j.flag]} 未被發現`);
    startPickup(j); dirty.q=dirty.stock=dirty.detail=true; return;
  }
  // 乾淨的處方
  const slip = !h.briefed && chance(0.22);
  j.drug.have=Math.max(0,j.drug.have-1);
  j.status='done'; j.doneAt=S.t; j.byHelper=name; S.dispensed++;
  j.pat.given.push({d:j.drug.id,t:S.t});
  if (slip){
    S.errors++; h.err++;
    say(name, `這個品項……跟我以前用的不太一樣，我照名字拿的。`, 5200);
    log(`※ ${name} 取到同名不同劑量的品項（未經作業簡介）。`,'l-bad');
    mark('P10', false, `${name} 因不熟現行品項而取錯（未做作業簡介）`);
  } else {
    say(name, `#${String(j.n).padStart(2,'0')} 好了。${h.briefed?'我照你說的位置拿的。':''}`, 3800);
    mark('P1', true, `#${j.n} 由 ${name} 獨立完成調劑`);
    mark('P10', true, `${name} 在授權範圍內獨立完成一張處方`);
  }
  startPickup(j);
  dirty.q=dirty.stock=dirty.detail=true;
}

      <button class="opt" data-c="b"><b>先繼續作業，等交班時一起說</b>

function tickCold(dt){
  const load = S.genOn && S.fuel>0;
  let target = load?4.0:21.0;
  if (!load && S.fridgeBackup) target = 5.5;
  if (!load && S.iceBags>0){ target = 9.0; S.iceBags = Math.max(0,S.iceBags-dt*0.011); }
  S.fridge += (target-S.fridge)*dt*(load?0.05:0.011);
  if (S.fridge>8){
    S.coldBreach += dt;
    if (!S.coldWarned){ S.coldWarned=true;
      log('※ 冷藏庫溫度超過 8℃。Insulin 與破傷風類毒素疫苗開始計算脫鏈時間。','l-bad');
      openColdChoice(); }
    if (S.coldBreach>70 && !S.coldLost){
      S.coldLost=true;
      const ins=drugById.ins, tt=drugById.tt, oxy=drugById.oxy;
      if (S.coldSaved!=='ins') ins.have=0;
      if (S.coldSaved!=='tt') tt.have=Math.floor(tt.have*0.15);
      oxy.have=Math.floor(oxy.have*0.5);
      log('※ 脫鏈超過 70 分鐘。未受保護的冷藏品項效價存疑，依規不得使用。','l-bad');
      mark('P5',false,`冷鏈中斷 ${Math.round(S.coldBreach)} 分鐘，冷藏品項報廢`);
      dirty.stock=true;
    }
  } else S.coldWarned=false;
  dirty.top=true;
}
function openColdChoice(){
  openModal(`<h1>冷藏庫溫度上升</h1>
    <p class="kicker">2–8℃ · 目前 ${S.fridge.toFixed(1)}℃ · 你有大約 70 分鐘</p>
    <div class="note cold">冰箱（附件五 G3，100–150W）掛在發電機上。裡面是
      <b>Insulin ×${drugById.ins.have} 支</b>、<b>破傷風類毒素 ×${drugById.tt.have} 罐</b>、

  if (st!==S.stage){ S.stage=st;
    if (st===2) log('遠處低頻嗡鳴，同一方位重複出現。','l-warn');

}

/* 畫質自適應：連續掉幀就把陰影與像素比降下來，寧可少一點光影也不要卡 */
const perf={frames:0, acc:0, level:2, warm:0, bad:0};
function tuneQuality(raw){
  perf.warm+=raw;
  if (perf.warm<4) return;                 // 開場載入字型與貼圖的前幾秒不算
  perf.frames++; perf.acc+=raw;
  if (perf.acc<2.5) return;
  const fps=perf.frames/perf.acc; perf.frames=0; perf.acc=0;
  perf.bad = fps<26 ? perf.bad+1 : 0;
  if (perf.bad>=2 && perf.level>0){
    perf.bad=0;
    perf.level--;
    if (perf.level===1){ renderer.setPixelRatio(1); log('畫質已調降（像素比）以維持流暢。'); }
    else { renderer.shadowMap.enabled=false; scene.traverse(o=>{o.castShadow=false;});
      log('畫質已調降（關閉陰影）以維持流暢。'); }
    onResize();
  }
}
const MIN_PER_SEC = 0.4;   // ×1：1 實秒 ＝ 0.4 遊戲分鐘（白班 720 分鐘 ≈ 30 分鐘實時）
