function loop(now){
  requestAnimationFrame(loop);
  const raw = Math.min(0.1,(now-last)/1000); last=now;
  if (S.running && !S.over){ const dt = raw*S.speed*MIN_PER_SEC; S.t+=dt; step(dt); }
  tickPickups(S.running && !S.over ? raw*S.speed*MIN_PER_SEC : 0);
  stepPlayer(raw); render3D(raw); flushUI(); tuneQuality(raw);
}
function step(dt){
  while (S.nextJob<JOBS.length && S.t>=JOBS[S.nextJob].t){
    const spec = JOBS[S.nextJob++];
    // 有前後關係的處方：條件還沒成立就往後挪，成立不了就不出現
    if (spec.dep){
      const p=patById[spec.dep.pid];
      if (!p.given.some(g=>g.d===spec.dep.given)){
        spec.tries=(spec.tries||0)+1;
        if (spec.tries<8){ const at=S.t+rint(25,45);
          const k=JOBS.findIndex(x=>x.t>at); JOBS.splice(k<0?JOBS.length:k,0,{...spec,t:at});
          if (k>=0 && k<=S.nextJob) S.nextJob++; }
        continue;
      }
    }
    if (spec.kind==='evt') fireEvent(spec.id); else pushJob(spec);
  }
  for (let i=S.pending.length-1;i>=0;i--){
    const c = S.pending[i];
    if (S.t<c.at) continue;
    S.pending.splice(i,1);
    if (c.follow){ pushJob({...FOLLOWUP[c.follow], t:S.t}); log('先前的諮詢回覆帶回了一張處方。','l-warn'); continue; }
    if (c.steal){ doTheft(c.steal); continue; }
    if (c.idn){ pushJob({kind:'idn', t:S.t, ...c.idn}); continue; }
    if (c.raidLoss){                      // 警報時沒鎖的那個櫃子
      const t=DRUGS.filter(d=>d.st==='ctrl'&&d.have>0);
      if (t.length){ const d=pick(t), n=Math.min(d.have,rint(1,3)); d.have-=n;
        S.theft={who:'不明', d, n, t:S.t};
        mark('P3',false,`空襲警報期間管制藥品櫃未上鎖，${d.n.split(' ')[0]} 短少 ${n} ${d.u}`);
        log(`※ 警報結束後清點：${d.n.split(' ')[0]} 少了 ${n} ${d.u}。櫃子當時是開的。`,'l-bad');
        dirty.stock=true; }
      continue; }
    if (c.remind){                          // 先給一劑的那張，剩下的要有人回來要
      const r=c.src;
      log(`護理站問 #${String(r.n).padStart(2,'0')} ${r.drug.n.split(' ')[0]} 剩下的劑量什麼時候給。`,'l-warn');
      say('李護理師', `藥師，${r.pat.nm} 那張只拿到一劑，後面呢？`, 4600);
      continue; }
    const b = c.src;
    if (c.reissue){ pushJob({kind:'rx',pid:b.pid,d:b.d,dose:b.dose,by:b.by,flag:b.flag,why:b.why,
      alt:b.alt,altD:b.altD,ctrl:b.ctrl,stat:b.stat,reissued:true});
      log(`${b.by} 把處方 #${b.n} 原樣送回。`,'l-warn'); }
    else { pushJob({kind:'rx',pid:b.pid,d:b.altD||b.d,dose:'依你的建議修正',by:b.by,flag:null,corrected:true,
      why:'這是依你的攔截建議開立的修正處方。'});
      log(`${b.by} 依你的建議開立修正處方。`,'l-ok'); }
  }
  if (S.task){ S.task.remain-=dt;
    if (S.task.remain<=0){ const f=S.task.then; S.task=null; if(f) f(); }
    dirty.detail=true; }
  if (S.genOn && S.fuel>0){ S.fuel=Math.max(0,S.fuel-dt*0.052);
    if (S.fuel<=0){ S.genOn=false; log('※ 發電機油用罄。','l-bad'); } }
  S.fatigue = Math.min(100,S.fatigue+dt*0.03);

    if (j.kind!=='rx') continue;
    const age = S.t-j.issued;
    if (j.stat && age>30 && !j.lateFlag){ j.lateFlag=true;
      mark('P1',false,`#${j.n}（STAT）等待逾 30 分鐘`);
      log(`#${String(j.n).padStart(2,'0')} 為立即處方，已等待 ${Math.round(age)} 分鐘。`,'l-warn'); }
  }
  if (S.t>=720 && !S.over) openHandover();
  dirty.top=dirty.q=true;
}

      push('04:50','冷藏庫溫度再次上升','bad','沒有人被交代要看溫度。早上你走過去的時候，面板顯示 14.6℃，已經這樣好幾個小時了。');
  }
  // 疲勞
  let fatigue;
  if (mode==='awake'){ fatigue=Math.min(100,S.fatigue+42);
    push('06:00','天亮','mid','你一夜沒睡。所有事都經過你，所以幾乎沒有出錯——但你現在的判斷力比昨天差得多，而第五天的白班還是只有你一個藥師。');
    mark('P8', false, '整夜未休息，違反人員輪替原則，隔日作業風險升高'); }
  else if (mode==='split'){ fatigue=Math.max(0,S.fatigue-18);
    push('06:00','天亮','ok',`你睡了大約四個小時，被叫醒 ${ev.filter(e=>e.ok==='ok').length} 次。這是這幾天最接近正常的一晚。`);
    mark('P8', true, '採分段休息並設定明確的叫醒條件'); }
  else { fatigue=Math.max(0,S.fatigue-34);
    if (ev.filter(e=>e.ok==='bad').length>=2){
      push('06:00','天亮','bad','你睡滿了。代價是你早上一進藥局，就看見三件昨晚沒有人處理好的事。');

    else { push('06:00','天亮','ok','你睡滿了，而且站還在運轉。你昨天留下的東西撐住了今晚。');
      mark('P8', true, '完整的書面交代與適當授權，使夜間作業在無藥師下仍安全'); }
  }
  S.night={mode,wake,ev,fatigue};
  ev.forEach(e=>{ if(e.ok==='bad') mark('P8',false,`${e.t} ${e.title}：未能安全處理`);
    else if (e.ok==='ok') mark('P8',true,`${e.t} ${e.title}：安全處理`); });

  const MN={awake:'整夜自己守著',split:'分段睡 4 小時並設定叫醒條件',delegate:'完整交代後睡滿'};

/* ---------- 10. AAR ---------- */
function verdict(k){ const e=S.comp[k],t=e.good+e.bad; if(!t)return 1;
  const r=e.good/t; return r>=0.8?0:r>=0.5?1:2; }
const VN=['達成','有條件達成','未達成'];
function endGame(){

  const rate = flagged.length?Math.round(caught.length/flagged.length*100):100;
  if (S.counted) mark('P4',true,'完成藥品盤點與效期查核'); else mark('P4',false,'全場未執行藥品盤點');
  const outs = DRUGS.filter(d=>d.have<=0);

    const v=verdict(k), e=S.comp[k];

      .map(x=>`${x.t}　${x.txt}`).join('<br>') || '無紀錄';
    return `<div class="cmrow"><span class="cid">${k}</span>

    <td><b style="color:var(--bad)">${REASON_N[j.flag]}</b><br>

    || '<tr><td colspan="4">本場未退回任何處方。</td></tr>';
  const cons = S.jobs.filter(j=>j.kind==='con'&&j.status==='done').map(j=>{
    const o=j.opts[j.picked];

    <li><b>稀有機會是盟軍。</b>迷彩樣式你不太認得，臂章不是國軍的，講的話也不是你熟的那一種：
      <br>・<b>盟軍聯絡士官</b>講日語：「すみません、薬剤師さんですか。破傷風の予防接種はありますか。」
      <br>・<b>盟軍衛勤士官</b>講英語：「Generic names only, please. I cannot read your brand names.」
      <br>外文的下一行會附上中文說明（漢字看得懂的部分也會提到）。
      而且如果<b>站內剛好有人會講那種語言</b>，敘述會直接告訴你——可以請他過來。
      他們要的東西都在你的業務範圍裡：破傷風、成分確認、用學名溝通、書面的劑量與天數。</li>
    <li><b>畫面其他調整：</b>環境光稍微提亮並在公共空間、留觀區、廢棄物區各加一盞微弱頂燈，
      讓藥局以外的地方看得見而又不搶走「只有調劑檯是亮的」這件事；
      通風管移到貼著天花板、變細，不再橫切視野；
      隔離區的帳篷只畫外側面，走進去不會被一片白牆擋住；
      診療區的帆布降到 1.7 公尺、半透明，可以看過去。
      <b>手機上自動省略最細的那一層</b>（部分柱號、灑水頭、機車、排水溝刻度），
      draw call 從 300 降到 276，畫質降級次數減半。</li>
  </ul>

  <h2>0d. v1.4：一張真的清單，與一個只在藥局桌上的問題</h2>
  <ul>
    <li><b>可以請求的品項從 10 項擴到 44 項</b>，依附件六的分類排開：
      <b>急救</b>（Epinephrine、Atropine、CaCl₂、Sod. Bicarbonate、Amiodarone、TXA、NTG、Hydrocortisone）、
      <b>止痛與鎮靜</b>（Morphine、Fentanyl、Midazolam、Diazepam、Tramadol、Acetaminophen、Ibuprofen）、
      <b>抗生素</b>（Cephalexin、Ceftriaxone、Amoxil/Clav、Azithromycin、Ciprofloxacin、SSD）、
      <b>慢性病</b>（Insulin、Amlodipine、Furosemide、Metformin、Lansoprazole、Prednisolone、Ipratropium、Lorazepam）、
      <b>兒科婦產</b>（兒童退燒藥水、兒童抗發炎藥水、Amoxil 懸液、ORS、Oxytocin、Misoprostol）、
      <b>輸液與疫苗</b>（NS、Ringer、破傷風類毒素）。
      每一項都標出它現在的實際／帳面數量，低於三成與已歸零會直接標紅——
      所以你不是在背清單，你是在看自己的架子。</li>
    <li><b>還有「不是藥但沒有它就發不出藥」的六樣耗材：</b>
      發電機柴油、冰寶與保冷袋、空針與輸液套與酒精棉片、藥袋標籤紙與墨水、口服注射器與量藥杯、
      管制藥品簿冊與封籤。而且<b>第四天了，其中一部分本來就短缺</b>（由種子決定），短缺是有代價的：
      <br>・沒有空針 → 針劑調劑多花 2 分鐘（要跑到別的區找）。
      <br>・沒有標籤紙 → 從那一張開始藥袋上的字是你手寫的，P2 記一筆「品名劑量易誤讀」。
      <br>・沒有量藥杯 → 兒童藥水沒辦法量到毫升，你只能跟家屬說「大概到這裡」。
      <br>・簿冊快用完 → 管制藥品的逐筆登記欄位會直接警告你「再寫下去就是寫在便條紙上，那不算登記」。
      <br>這些東西平常不會有人想到要請求。第四天的下午你就會想到了。</li>
    <li><b>一台車能帶的是 6 項</b>（原本 4 項）。44 選 6，而且你<b>有盤點</b>才說得出數量、要什麼給什麼；
      沒盤點只能領標準包。挑哪六樣，就是你今天的判斷。</li>
    <li><b>語言障礙的題目全部收回藥局的桌上。</b>原本有幾個選項其實不是藥師在做的事
      （通報、追問身分、等身分確認）。現在每一個選項都是你在領藥窗口真的會做的動作：
      辨識自備藥的實物、比對成分、確認吃過幾天幾顆、查本站今天已經給過什麼、
      攔下與過敏史衝突的處方、寫出對方看得懂的書面指示、請雙方複誦。
      案例也改成<b>從一開始就是藥事問題</b>——傷口醫師處理好了，卡在你這裡的是「她長期吃的是什麼、能不能開下一劑」。</li>
    <li><b>語言案例從 3 個增為 5 個</b>：日文（盟軍人員的自備藥袋）、英文（過敏警示手環與 β-lactam 處方）、
      <b>越南語</b>（鄰棟移工帶兩排越南文包裝的藥來問能不能繼續吃）、
      口音與用詞不同的中文（「消炎藥」是止痛的還是殺菌的）、
      <b>印尼語</b>（看護替有鼻胃管的失智長者領藥，處方裡有一顆腸溶錠）。
      每個案例自帶可通譯的語言清單，站內剛好有人對得上就會多出那個選項。</li>
    <li>「身分」那一題仍然在，但它現在只長在藥局的動作上：
      <b>不因身分改變劑量、不在用藥紀錄寫身分推測、不把用藥問題擱到身分確認之後</b>。
      分辨他是誰，不是藥師的業務——那句話現在寫在題目裡。</li>
  </ul>

  <h2>0e. v1.3：人是來來去去的</h2>
  <ul>
    <li><b>修掉一個真的很吵的 BUG。</b>物流或語言障礙的傷患一出現，下面的對話框就會一直重複冒同一句——
      原因是佇列的<b>繪製函式裡誤貼了一段建立工作時才該跑的程式碼</b>，畫面每重繪一次就再說一次話、再寫一次紀錄。
      現在那兩種工作在佇列裡也會正常顯示品名與狀態（之前是空白的）。</li>
    <li><b>衛教可以交給人了。</b>新增三種授權範圍：<b>衛教與給藥指導</b>、<b>語言協助</b>、<b>紀錄與文書</b>。
      被授權衛教的人會<b>自己從佇列把衛教接走</b>，你專心處理處方。
      但結果取決於他是誰：藥師與護理師做得完整；做過作業簡介的更完整；
      而藥助、學生、志工被授權衛教時，病人會「有人跟他說過話」，卻不一定學到該學的事
      ——紀錄上會寫成「他照藥袋上的字念給病人聽，病人點頭了」。</li>
    <li><b>有人會講別的語言。</b>約四成的幫手會講台語、客語、日語、英語、越南語、印尼語或粵語。
      如果站內剛好有人的語言對得上那位聽不懂中文的傷患，
      那張工作單上會<b>多出一個真的有用的選項</b>：請他協助通譯並請雙方各複誦一次。</li>
    <li><b>人會走。</b>每個幫手都有自己的時限與理由：上面的收容所排了輪班、女兒在留觀區、
      站長把他調去檢傷、從昨天到現在沒睡、先生在外面等。
      大約四分之一的人會待到你下班，其餘的待一到四個小時。
      走之前他會跟你說一聲；如果他手上還有沒做完的事，那筆會記在 P10 的「交接中斷」。
      在站期間他也會<b>暫時離開幾分鐘</b>（去搬東西、去看家人、去上廁所），然後回來。</li>
    <li><b>人會動。</b>3D 裡的幫手不再排排站：他們會走到自己該在的位置——
      顧窗口的站到領藥窗口、盤點的走到藥品架、在調劑的靠到檯前，有事做的人走得比較快。
      每個人頭上有<b>名牌</b>，走了的人就從場景裡消失。</li>
    <li><b>他們會講話。</b>新增日常對話系統：幫手、護理師、醫師、站長與民眾會依<b>時段、你的疲勞、
      庫存狀況、冷藏庫溫度</b>挑話來說——早上問你外面怎麼樣，中午問你吃了沒，
      傍晚說「天要黑了」「等一下幾點換班？喔……沒有人換」。同一句不會說第二次，
      而且有人正在跟你說正事時不會插隊。</li>
    <li><b>畫面：</b>調劑檯那盞燈現在看得見<b>光錐與地上的光池</b>——整個地下室只有那一塊是亮的。
      場景加了補給推車、板凳、還沒拆的紙箱、牆上的時鐘與白板、牆邊的緊急照明帶。
      幫手面板重排（之前名字會被擠成一直行），加上語言標籤、正在做什麼、還會待到幾點。
      AAR 的幫手欄位補上在站時間與離開原因，衛教欄位標出是誰做的。</li>
  </ul>

  <h2>0f. v1.2：錯的不是「醫師」，是被放錯位置的人</h2>
  <ul>
    <li><b>處方錯誤率從 45% 降到 15%。</b>原本二十張處方裡有九張是錯的——那不是急救站，
      那是考卷。現在一場約 <b>25 張處方，其中 3–5 張有問題</b>，而且每一場抽到的都不一樣。</li>
    <li><b>錯誤有了主人。</b>新增<b>開立者模型</b>：每個人有自己的開方量、錯誤率與<b>錯誤型態</b>。
      <br>・<b>張醫師</b>（急診專科第 11 年）約 5%，而且他錯的通常不是判斷，是他不知道我們缺什麼。
      <br>・<b>何醫師</b>（家醫科主治）約 7%，忙起來會漏看重複用藥。
      <br>・<b>林醫師</b>（一般外科，平常不開內科藥）約 26%：兒童劑量、劑型途徑、用法只寫「止痛 prn」。
      <br>・<b>陳醫師</b>（醫美，住院醫師訓練後未再接急重症）約 30%：交互作用、管制藥品程序、兒童用藥。
      <br>・<b>郭醫師</b>（社區診所四十年，自願留下）約 24%：舊商品名與舊劑量習慣、未依腎功能調整、
        該族群已禁用的用法（例如給五歲孩子開 Codeine 鎮咳）。
      <br>・<b>蘇護理師</b>（依醫囑轉抄）約 10%：漏抄劑量這種手誤。
      <br>分配方式不是「凡是錯的都是他開的」——是先把錯的分給會犯那種錯的人，
      再依各人應有的錯誤率<b>補上乾淨的處方</b>，所以每個人的個人錯誤率才會落在他該有的水準。</li>
    <li><b>於是「看出規律」變成一種能力。</b>同一個人第二次出問題時，紀錄會直接告訴你他是誰、
      他為什麼會錯。AAR 新增「<b>今天的處方是誰開的</b>」一欄：每個人幾張、其中幾張有問題、你攔下幾張。
      <span style="color:var(--ink-faint)">這一欄不是用來檢討醫師。把人放到他不熟的位置上，錯誤會落在可以預測的那幾格裡——
      知道會落在哪幾格，正是藥師站在這裡的理由。</span></li>
    <li><b>退回不再是唯一的出路。</b>處方面板新增三種處置：
      <br>・<b>向開立者確認</b>（${T.ask} 分鐘）——真正的藥師第一個會做的事。結果有三種：
        他同意更正（修正處方稍後送來，算你攔截成功，而且沒有中斷給藥）、
        他堅持原處方（你可以照配並註記，也可以正式退回；<b>提出疑慮＋照配＋完整註記</b>在 P1 是<b>達成</b>，
        因為那已經是藥師能做到的全部）、或他人在處置區叫不回來。
      <br>・<b>改用替代品項並取得口頭醫囑</b>（${T.sub} 分鐘）——品項要你<b>自己從清單挑</b>，
        清單混合同分類、同劑型與正解，依品名排序，看不出哪一個是答案；
        沒勾「已取得口頭醫囑並請補簽」會同時扣 P3 與 P8。
      <br>・<b>先給第一劑，其餘暫緩待確認</b>——數量不夠時這是穩住病人的做法；
        問題不在數量的時候，先給一劑一樣會把問題給出去。而且過一陣子護理站會回來問你剩下的。</li>
    <li><b>退回理由從 8 項增為 12 項</b>：新增「兒童用藥不適當」「未依器官功能調整」
      「用法未寫清楚或無法判讀」「已不建議或已禁用的用法」。
      並新增<b>相近理由的部分認定</b>：攔對了但切點不同（例如寫「劑量不符」而實際是「兒童用藥不適當」），
      算攔截成功，只在 P7 記一筆「開立者可能不知道要改哪裡」。</li>
    <li><b>突發事件從 2 種變成 11 種</b>，每場隨機抽 3–5 個，時間與順序都不同：
      空襲警報（管制藥品櫃還開著，你有十幾秒）、通訊中斷（這段時間「向開立者確認」用不了）、
      冰箱門沒關緊、外觀相似品項（LASA）、停水、避難民眾拿自備藥來問、鄰區急救站無線電求援、
      有人無處方來要安眠藥、標籤被水泡爛到看不出效期。加上原有的大量傷患與管制藥品短少。</li>
    <li><b>其餘隨機性也放寬：</b>CBRNE 只在六成的場次出現、大場景 EMT 七成五、
      物流 1–3 次、諮詢 4–6、衛教 2–4、支援作業 2–3、語言障礙 1–2、EMT-2 求援 2–4。
      一場約 50–55 項，兩個種子跑出來的班表不會像。</li>
  </ul>

  <h2>0g. v1.1：修掉手機上打不開的那個洞</h2>
  <ul>
    <li><b>症狀。</b>在 App 內開啟時版面破掉、按鈕按不到。原因是
      <b>手機版面完全靠 <code>@media (max-width:960px)</code> 判斷</b>——而宿主的檢視器給的
      版面視窗寬度可能是 980px（沒有套 viewport），media query 整個不成立，
      於是四欄的桌機版面被塞進一支手機的螢幕裡，看得到的按鈕也不在手指按下去的位置。</li>
    <li><b>斷點改成量出來的。</b>不再問 media query，而是實際量
      <code>documentElement.clientWidth</code>；若是觸控裝置且這個寬度比
      <code>screen.width</code> 大 1.6 倍以上，就以螢幕寬度為準——
      量到窄就在 <code>&lt;html&gt;</code> 掛上 <code>.narrow</code>／<code>.tiny</code>／<code>.land</code>，
      所有手機規則都掛在這些 class 上。視窗變動、轉向、以及載入後 0.1／0.4／1.2 秒各重量一次
      （有些宿主容器是晚一點才定尺寸的）。</li>
    <li><b>自己補一份 viewport。</b>頁面開頭放一份
      <code>&lt;meta name="viewport" content="width=device-width"&gt;</code>，
      並在程式一開始檢查它是否存在且內容正確，不對就補上。這一條單獨就足以修掉多數情況。</li>
    <li><b>「按了沒反應」的第二個原因。</b>為了避免手指還沒離開就把 DOM 換掉，按下時會暫停重繪，
      原本靠 <code>pointerup</code>／<code>pointercancel</code> 解除——但手機上這兩個事件有時根本不會送到
      （手勢被 webview 接走），於是整個面板從此不再更新，看起來就是每個按鈕都死了。
      現在這個「按住」<b>最多只算 420 毫秒</b>，事件漏掉也會自己解除，另外多聽
      <code>touchend</code>／<code>touchcancel</code>／<code>mouseup</code>／<code>blur</code>。</li>
    <li><b>版面高度不再賭。</b><code>#app</code> 仍以一個螢幕高排版（列高才不會被內容撐開），
      但加上 <code>min-height:430px</code> 的保險：宿主給的高度太矮時整頁可以捲，
      不會再有按鈕卡在畫面外。</li>
    <li><b>開場那排按鈕釘在底部。</b>簡報、設計文件、結束白班在手機上都很長，
      「我了解，開始白班」現在一直貼在說明的底部，不用滑到最下面去找。</li>
    <li><b>觸控細節。</b>所有按鈕加上 <code>touch-action:manipulation</code>（去掉 300ms 點擊延遲與雙擊縮放）、
      按下時有亮度回饋與點擊高亮色。</li>
  </ul>

  <h2>0h. v1.0：一支手機也能跑完一個白班</h2>
  <ul>
    <li><b>遊戲內容完全沒有更動。</b>這一版只做兩件事：讓它在手機上真的能用，以及把程式與畫面再收一次。
      同一個種子在電腦和手機上跑出來的，仍然是同一場。</li>
    <li><b>手機改成四個分頁。</b><b>工作</b>（佇列與站內幫手）／<b>處置</b>（你正在做的那一件）／
      <b>藥品</b>（藥品架與冰箱）／<b>紀錄</b>。3D 場景固定在上方三成高度，下面永遠只放你現在要看的那一塊，
      整頁不捲動——不會再出現「按了按鈕，但畫面在別的地方」。
      分頁上會直接標數字：待處理幾項、藥品歸零幾項；正在作業時「處置」會亮一個點。</li>
    <li><b>點了工作就跳到處置。</b>在手機上選佇列裡的任何一項，會自動切到處置分頁；
      按下「調劑並交付」進入數藥台、按「退回」展開理由欄、EMT-2 進到下一步時，
      畫面會自己把控制項捲進視線內。</li>
    <li><b>上排濃縮成一列。</b>42 px 高：時間、速度（手機只留 ▮▮／×1／×4）、發電機油。
      冷鏈、曝光、待處理改由 3D 上的冷藏庫面板與分頁徽章呈現；種子、自動暫停、設計文件、結束白班收進「⋯」。
      「回調劑檯」在手機上縮成一個「檯」字。四吋半以下的機器連站名也讓位給按鈕。</li>
    <li><b>觸控目標放大。</b>數藥的 −10／−／＋／＋10、勾選框、選項卡、處方列、方向鍵全部加大到手指按得準的尺寸；
      方向鍵移到右下角並降低不透明度，不擋場景。</li>
    <li><b>畫面：</b>手機一開始就用較低的像素比（1.25）與較軟的陰影貼圖（512／256），
      寧可從頭就順，不要跑個三秒才降級。桌機維持原本的畫質預算。</li>
    <li><b>程式：</b>諮詢與 EMT-2 求援原本是兩份幾乎一樣的程式碼，和先前的衛教／支援／語言一樣收斂成同一個版型
      （單選版型與複選版型各一份）；藥品欄的收合軌在手機上移除（分頁本身就是開關）；
      空檔作業列在窄螢幕上只留按鈕，做事的時候才把進度那一行放回來。</li>
  </ul>

  <h2>0i. v0.9：不綁時間的數藥、物流到訪、聽不懂的傷患</h2>
  <ul>
    <li><b>調劑不再空轉倒數。</b>口服固體的「工作」就是<b>數藥本身</b>——數完即交付，沒有進度條。
      針劑保留時間（要抽、要稀釋、要再核對一次），其餘劑型縮到 2–3 分鐘。
      連帶把全部作業時間壓下來（v1.7 起所有時間都由同一張表 <code>T</code> 決定，面板上寫幾分鐘就跑幾分鐘）：退回 ${T.ret} 分、諮詢 ${T.con}、衛教 ${T.edu}、作業簡介 ${T.brief}、盤點 16、備藥包 20。</li>
    <li><b>物流會來，但不一定是來給的。</b>國軍後勤、民防大隊物流組、盟軍聯絡官、國際人道組織，
      每場隨機來 2–3 次。<b>來給的</b>會問你缺什麼——你<b>有盤點</b>就說得出品項與數量，要什麼給什麼；
      <b>沒盤點</b>就只能領標準包，數量差很多（「你講不出數量，我只能照標準包給。下一站還在等。」）。
      <b>來要的</b>則是徵調：你決定給什麼、留什麼、拒絕與否，管制藥品的移轉還要辦紀錄與雙方簽收。</li>
    <li><b>聽不懂的傷患。</b>盟軍的日文傷患（漢字筆談、藥袋實物比對成分）、國際組織的英文傷患
      （先讀過敏警示手環、用學名溝通、給書面指示）、以及<b>口音與用詞都不一樣的中文傷患</b>——
      他說「消炎藥」的時候你不確定他指的是抗生素還是止痛藥，他說不出在哪裡看過病，
      而外面有人小聲問你：「他是哪邊的人？」<br>
      這一題不是要你分辨他是誰。<b>依醫療需求施救、不因身分區別</b>是不可協商的原則；
      選到「先通報再處置」「在紀錄上註記疑似敵方人員」「追問他為什麼口音不一樣」會被單獨標記為
      <b>以身分推測影響了臨床處置或紀錄</b>。你要回答的還是那三個問題：他吃過什麼、對什麼過敏、你能不能安全地給他下一劑。</li>
    <li>能力矩陣為 <b>P14</b>，新增「語言障礙下的用藥安全」與「物資調撥與外部協調」。</li>
    <li><b>介面：</b>工作佇列加上分類過濾列（處方／諮詢／衛教／EMT／支援／物流／語言／CBRNE／幫手，各自標示待處理數）與「只看待處理」。
      <b>程式：</b>衛教、支援作業、語言三種面板原本是三份幾乎一樣的程式碼，收斂成同一個版型；
      右欄所有勾選框改由單一事件委派管理，不再隨面板重繪而重新綁定；
      對外調撥的決策在按下的那一刻就<b>凍結</b>，之後的重繪不會再影響已經做過的決定。</li>
  </ul>

  <h2>0j. v0.8：第四天的藥局</h2>
  <ul>
    <li><b>庫存不是滿的，而且帳面不一定準。</b>七日儲備量是開站那天的數字；現在是第四天，每個品項用掉了三成到九成，
      而<b>帳面與實際有落差</b>——因為前三天忙到沒有人好好登記。左側藥品架顯示的是<b>帳面</b>（數字旁有個「帳」字），
      盤點之後才會變成實際。<b>管制藥品是唯一的例外</b>：它逐筆登記，帳面必須等於實際。<br>
      代價是真的：你照帳面說「還有 40 顆」，數到一半才發現架上只剩 1 顆——那張處方就配不出去了，而病人在等。</li>
    <li><b>調劑變成數藥。</b>處方寫的是用法，不是數量——數量要你自己算。
      <code>500 mg PO q6h ×3 日</code> 是 1 顆 × 4 次 × 3 日 ＝ 12 顆；
      <code>Ibuprofen 200mg，400 mg PO tid ×3 日</code> 是 2 顆 × 3 次 × 3 日 ＝ 18 顆。
      罐裝就是數顆；<b>排裝要換算成「幾排又幾顆」</b>——每排幾顆每個品項不一樣（10、14、7、6、4 都有）。
      數錯會扣 P2，而且庫存會照你真的數出來的數量扣。</li>
    <li><b>事件順序完全打散。</b>處方不再按劇本順序出現。有前後關係的那幾張（重複用藥、劑量翻倍）改成
      <b>條件成立才會出現</b>——你真的給過一次，重複的那張才會來。所以打散不會讓劇情說不通。</li>
    <li><b>EMT-2 減量成日常求援。</b>大場景一場只會遇到一個，其餘變成護理師隨口叫住你：
      「你會打 IM 嗎？這支 TT 你幫我打一針」「我要做 SMR，你幫我扶頭」「他在躁動，你幫我固定住手臂」
      「六床的 NS 快跑完了，你幫我換一瓶」。每一題的正解都不是「好」或「不行」，是<b>「好，但我先核對」</b>——
      別人抽好的藥不能直接接手就打。</li>
    <li><b>冒名者裡有想偷藥的人。</b>他會問你管制藥品櫃的鑰匙放在哪，眼睛一直在櫃子上，袖口鼓鼓的。
      如果你給了他藥局的作業權限，一個多小時後他會不見，而管制藥品的實際數量會少掉——<b>帳面不動</b>，
      所以簿冊一定對不起來。這就是「管制藥品短少」事件的真正來源。</li>
    <li><b>雜事可以交給藥助等級的人獨立做完。</b>空檔工作列上會出現「交給林小姐」，
      她自己把盤點或備藥包做完，不佔用你的時間。但你不在旁邊看著——
      <b>沒受過作業簡介的人「數」出來的數字，比不數更危險</b>，因為它看起來很整齊。</li>
  </ul>

  <h2>0b. v0.7：每一場都不一樣，但可以指定成一樣</h2>
  <p>畫面右上角有一個<b>種子</b>。它決定這一場會走進來哪些人、他們說什麼、哪些諮詢與衛教會出現、大量傷患與 CBRNE 落在幾點。
    同一個種子跑出來的東西完全相同——<b>教官可以把連結發給全班，讓每個人面對同一場，然後橫向比較</b>；
    想換一場就換一個種子。點那顆鈕會把帶種子的連結複製起來。</p>
  <h3>幫手是生成的，不是寫死的</h3>
  <p>每一場會有 3–5 個人走到領藥窗口，從十三種原型裡抽：現職藥師（外院疏散）、退休藥師、藥師助理、藥學系學生、護理系學生、
    護理師、牙醫師、獸醫師、中藥行從業人員、照顧服務員、一般志工，以及兩種<b>冒名者</b>——自稱在藥廠做了十年的業務，
    和拿不出有效執照的「我是藥師啊，執照在家裡」。姓名、年資、前一份工作、為什麼會在這裡、你注意到的小細節，都是當場生出來的。</p>
  <p>查核的三態也因此有意義：<b>相符</b>（他說的是真的）、<b>屬實但不涵蓋</b>（牙醫師、獸醫師、中藥行從業人員——資歷是真的，
    但那不是西藥調劑）、<b>查無資格</b>（冒名）。中間那一態最難，也最像現實。</p>
  <h3>走動時的隨機遭遇</h3>
  <p>同一個功能區每次不一定遇到同一件事：庫備品區的 Cephalexin 被塞在輸液那一層、
    廢棄物桶裡出現一個 Morphine 空安瓿、處置台上有兩支已經抽好但沒有貼標的空針、
    白板右下角有人用紅筆寫了「藥師：24h」而字跡不是你的。有些只是氛圍，有些會直接記進能力矩陣。</p>

  <h2>0b. v0.6.3：站不是一個平面圖，是一個你走得進去的地方</h2>
  <ul>
    <li><b>移動即敘述。</b>走進任何一個功能區，畫面下方會用一行字告訴你看見什麼——留觀區的點滴聲在柱列之間反射、
      廢棄物區的針具桶快滿了、行政區的無線電在沙沙作響而沒有人在聽。第二次走進同一區，看見的是不同的東西。</li>
    <li><b>會被叫住。</b>走近隊員，他們會跟你說話。「嗨藥師，等下我去領藥，你不用特地跑一趟」「鼻胃管那個到底能不能磨粉？我怕又弄錯」
      ——有些是寒暄，有些是情報，有些是下一張處方的預告。走出藥局因此有了報酬，不只是離開崗位的成本。</li>
    <li><b>空檔工作。</b>盤點、製冰、備藥包、歸檔不必一口氣做完。你在等人、等窗口、等別人回話的時候它會繼續跑，
      一有工作進來<b>自動放下</b>，處理完<b>從斷點接回去</b>。畫面最下面那一列就是它。這比「有空才做得完」誠實得多。</li>
    <li><b>藥師幫手會獨立作業。</b>藥助只能協助你；但一位查核過、具備藥師資格、被授權調劑與核對的人，
      可以自己把一張處方從頭做到尾。他會從佇列裡挑——<b>不碰管制藥品、不碰 STAT</b>，那些留給你。
      做過作業簡介的他，遇到有問題的處方會<b>停下來問你</b>（「這張你看一下，傷患06 在吃 Warfarin」）；
      沒做作業簡介的他，會照單配出去，或是因為不熟現行品項而取到同名不同劑量的東西。<br>
      這是整個幫手系統的答案：<b>那 ${T.brief} 分鐘的作業簡介，買的不是速度，是他會不會在該停的時候停下來。</b></li>
  </ul>

  <h2>0b. 幫手：查核不是懷疑人，是流程</h2>
  <p>指引行政區的說明第二點寫著：「<b>確認新進醫事人員職業類別與有效執照，以及作業簡介。部署期間的任務發布與共識討論</b>」。這句話在遊戲裡被拆成三個你必須做的決定：</p>
  <ul>
    <li><b>查核</b>——請他出示證件並追問經歷（${T.verify} 分鐘），或人手不夠先讓他上工（${T.verifyFast} 分鐘）。有一個人的自述是假的。</li>
    <li><b>授權範圍</b>——藥助可以分裝貼標、點藥、顧領藥窗口，但<b>不能調劑、不能核對</b>；護理系學生可在你直接監督下抽藥，但不得獨立作業；沒有醫事資格的人只能搬運與跑腿。勾錯了他真的會去做，而且會出錯。</li>
    <li><b>作業簡介</b>——${T.brief} 分鐘，換取他之後的正確率與速度。那位退休四十年的陳藥師自己說了他不熟現行品項；這 ${T.brief} 分鐘不是客套。</li>
  </ul>
  <p>授權得當的幫手會實際縮短你的調劑時間、代你完成分裝與備藥包；授權失當的幫手會在你背後把外觀相近的品項拿錯，而你在交付前沒有再核對一次。</p>

  <h2>0c. 你走不了</h2>
  <p>v0.5 把 20:00 寫成「交班」，那是和平時期的詞。在受困情境裡你不會下班——你睡在庫備品區的行軍床上。所以問題變成：<b>你要怎麼撐過今晚，還能有明天早上。</b></p>
  <p>三個選擇：整夜自己守（幾乎不出錯，但明天的你判斷力更差，而指引要求的是人員輪替）、分段睡四小時並<b>設定叫醒條件</b>（哪些事值得把你叫起來？管制藥品？冷鏈？兒童給藥？）、或完整交代後睡滿（賭的是你今天留下的東西夠不夠清楚）。</p>
  <p>夜間會依你留下的備藥包、書面指示、管制交接與授權品質，跑出四段結果。其中一段是：半夜三點，沒有人知道那個 12 歲的孩子不能用成人錠——除非你把那一行寫下來了。</p>

  <h2>0d. CBRNE</h2>
  <p>三名傷患從地面送來，流涎、瞳孔縮小、肌肉顫動、呼吸困難，人還在除污區外面。五個步驟：動線與通報、個人防護（「地下空間指引」Box-4 的 C 級抗化裝備）、解毒劑、資源極限、污染廢棄物。</p>
  <p>第三步是你的專業：本站有 <code>Atropine 1mg/1ml ×30 支</code>，<b>沒有 Pralidoxime（2-PAM）</b>，也沒有碘化鉀。第四步是這一段真正的重點——重度中毒的 Atropine 需求量可能遠超 30 支，而<b>你是全站唯一一個能在三分鐘內說出這句話的人</b>。</p>
  <p>第一步答錯的話，急救站就被污染了。你們在地下室。</p>

  <h2>1. 為什麼是藥師（而且是 EMT-2）</h2>

  <p>四種工作共用同一個佇列、同一段時間。<b>這才是真正的兩難</b>：不是「要不要攔這張處方」，而是「現在有一張 STAT 處方、一個護理師在窗口等答案、一個家長在問藥水怎麼量，你先做哪一個」。</p>

  <h2>3. 節奏</h2>

  <h2>4. 藥品是真的</h2>

    <code>Acetaminophen 120mg/5mL 兒童藥水 ×30 瓶</code>。冰箱（附件五 G3）掛在發電機上。</p>

  <h2>5. 能力矩陣</h2>

function stepPlayer(dt){
  const k=player.keys;
  if (k.q) player.yaw+=dt*1.5;
  if (k.e) player.yaw-=dt*1.5;
  let mx=0,mz=0;
  if (k.w) mz+=1; if (k.s) mz-=1; if (k.a) mx-=1; if (k.d) mx+=1;
  if (mx||mz){ const l=Math.hypot(mx,mz); mx/=l; mz/=l;
    const sp=4.8*dt, cs=Math.cos(player.yaw), sn=Math.sin(player.yaw);
    player.pos[0]=Math.max(-13,Math.min(13,player.pos[0]+(mx*cs+mz*sn)*sp));
    player.pos[1]=Math.max(-13.2,Math.min(6.2,player.pos[1]+(mz*cs-mx*sn)*sp)); }
  const ip=inZone(player.pos,'pharm');
  if (ip!==S.atBench){ S.atBench=ip; dirty.detail=true;
    $('hud-zone').textContent = ip?'你在調劑檯前':'你不在藥局，無法調劑'; }
  // 走進另一個功能區 → 描述你看見什麼
  const z = ZONES.find(zz=>inZone(player.pos,zz.id));
  const zid = z?z.id:null;
  if (zid!==player.zone){
    player.zone=zid;
    $('hud-place').firstChild.textContent = z? `${z.name}・${z.k}` : '車道口外';
    if (zid && ZONE_LOOK[zid]){
      const lines=ZONE_LOOK[zid];
      const i = (player.seen=player.seen||{}), k=i[zid]=(i[zid]||0);
      narrate(lines[Math.min(k,lines.length-1)]);
      i[zid]=k+1;
      // 隨機遭遇：同一個地方每次不一定遇到同一件事
      if (S.t - (S.lastEnc||-99) > 45 && chance(.45)){
        const pool = ENCOUNTERS.filter(e=>e.z===zid && !(S.encSeen||(S.encSeen={}))[e.t]);
        if (pool.length){
          const e = pick(pool);
          S.encSeen[e.t]=1; S.lastEnc=S.t;
          setTimeout(()=>{ if (e.who) say(e.who, e.t, 5600); else narrate(e.t, 5200);
            if (e.fx) e.fx(); }, 420);
        }
      }
    }
  }
  // 走近隊員 → 對方會叫住你
  for (const n of M.npcs||[]){
    n.cool=Math.max(0,(n.cool||0)-dt*4);
    if (n.cool>0) continue;
    if (Math.hypot(n.pos[0]-player.pos[0], n.pos[1]-player.pos[1]) < 2.3){
      const L=n.lines||GREETS[n.name]; if (!L) continue;
      n.said=(n.said||0);
      say(n.name, L[Math.min(n.said,L.length-1)], 4800);
      n.said++; n.cool=120;
    }
  }
}
function render3D(dt){
  if (!renderer) return;
  M.player.position.set(player.pos[0],0,player.pos[1]);
  M.player.rotation.y=player.yaw;
  // NPC 漫步
  M.npcs.forEach(n=>{
    n.wait-=dt;
    if (n.wait<=0){ n.tgt=[rnd(-2,12),rnd(-8,5)]; n.wait=rnd(6,18); }
    const dx=n.tgt[0]-n.pos[0], dz=n.tgt[1]-n.pos[1], d=Math.hypot(dx,dz);
    if (d>.2){ const s=Math.min(d,1.5*dt); n.pos[0]+=dx/d*s; n.pos[1]+=dz/d*s;
      n.g.rotation.y=Math.atan2(dx,dz); }
    n.g.position.set(n.pos[0],0,n.pos[1]);
  });
  // 諮詢者／前來幫忙的民眾站在領藥窗口
  const con = pending().find(j=>j.kind==='con'||j.kind==='help'||j.kind==='crowd'||j.kind==='lang');
  M.consult.visible=!!con;
  if (con){

  if (M.winLight) M.winLight.intensity=S.genOn?(S.pickups.some(k=>k.phase==='wait')?1.35:.85):.2;

  M.labels.forEach(sp=>{ const d=Math.hypot(sp.position.x-player.pos[0],sp.position.z-player.pos[1]);

const dirty={top:true,q:true,stock:true,detail:true,log:true,helpers:true,bg:true,speech:true};
const $=id=>document.getElementById(id);
const cache={};
function put(id,html){ if(cache[id]===html) return false; cache[id]=html; $(id).innerHTML=html; return true; }
/* 手機的面板比螢幕長。換到下一個互動階段時要把控制項捲進視線——
   不然按了「調劑並交付」，數藥台開在畫面外，會以為什麼都沒發生。 */
function reveal(sel){
  if (!MOBILE()) return;
  uiClock=0; flushUI();
  requestAnimationFrame(()=>{
    const d=$('detail'), t=d&&d.querySelector(sel);
    if (!t) return;
    const dr=d.getBoundingClientRect(), tr=t.getBoundingClientRect();
    if (tr.top < dr.top+8 || tr.bottom > dr.bottom-8) d.scrollTop += tr.top - dr.top - 10;
  });
}
let uiClock=0, holdAt=0;
/* 按下的瞬間先別重繪，免得 DOM 在手指離開前就被換掉。
   但這個「按住」是有時限的：手機上 pointerup／pointercancel 有時根本不會送到
   （webview 手勢接走了），只用事件收尾會把整個介面永久凍住——看起來就是按了沒反應。 */
addEventListener('pointerdown',()=>{holdAt=performance.now();},true);
['pointerup','pointercancel','pointerleave','touchend','touchcancel','mouseup','blur']
  .forEach(ev=>addEventListener(ev,()=>{holdAt=0;},true));
const uiHeld=()=>holdAt>0 && performance.now()-holdAt<420;
function flushUI(){
  const now=performance.now(); if (now-uiClock<210) return; uiClock=now;
  if (dirty.top){ renderTop(); dirty.top=false; }
  if (dirty.q){ renderQueue(); dirty.q=false; }
  if (dirty.stock){ renderShelf(); dirty.stock=false; }
  if (dirty.helpers){ renderHelpers(); dirty.helpers=false; }
  const ae=document.activeElement;
  // 只擋住「正在輸入」的元素；勾選框必須讓它重繪，否則按鈕不會解鎖。
  const busy=uiHeld()||(ae&&(ae.tagName==='SELECT'||ae.tagName==='TEXTAREA'
    ||(ae.tagName==='INPUT'&&ae.type!=='checkbox'))&&$('detail').contains(ae));
  if (dirty.detail&&!busy){ renderDetail(); dirty.detail=false; }
  if (dirty.log){ renderLog(); dirty.log=false; }
  if (dirty.speech){ renderSpeech(); dirty.speech=false; }
  if (dirty.bg||S.bg){ renderBg(); dirty.bg=false; }
  renderTabs();
}

      : j.kind==='help' ? `「${j.h.say.slice(0,26)}…」`
      : j.intro.slice(0,34)+'…';
    return `<button class="job k-${j.kind} ${j.status!=='pending'?'done':''}"
      data-j="${j.n}" aria-selected="${S.sel===j.n}">
      <span class="j-h"><b>${kd}#${String(j.n).padStart(2,'0')}${j.kind==='rx'?'　'+j.pat.nm:''}</b><span>${who}</span></span>
      <span class="j-t">${title}${chips}</span><span class="j-s">${sub}</span>
      <span class="j-p">${pat}</span>
      ${j.status==='pending'?`<span class="age ${age>25?'late':''}">等待 ${age} 分</span>`:''}
    </button>`;
  }).join('') || `<div style="padding:14px;color:var(--ink-faint)">${
    qFilter.kind==='all'&&!qFilter.pendOnly?'尚無工作項目。':'這個篩選下沒有項目。'}</div>`);
}
const shelfUI = {open:{}, q:'', lowOnly:false, collapsed:false};
Object.keys(CATS).forEach(k=>shelfUI.open[k]=true);
function renderShelf(){
  const qtyOf = d => d.counted ? d.have : d.book;      // 沒盤點就只能看帳面
  const low = DRUGS.filter(d=>qtyOf(d)>0 && qtyOf(d)/d.q<.3).length;
  const out = DRUGS.filter(d=>qtyOf(d)<=0).length;
  const sm=$('stockmeta');
  sm.textContent = out?`${out} 項歸零・${low} 項偏低`:(low?`${low} 項低於三成`:'7 日儲備');
  sm.className = out?'hot':'';
  const badge=$('stock-badge');
  badge.textContent = out?`${out}空`:(low?`${low}低`:DRUGS.length);
  badge.className = 'rn'+((out||low)?' hot':'');
  // 選到的處方品項會被highlight，並自動展開所在分類
  const selJ = S.jobs.find(x=>x.n===S.sel);
  const hi = selJ && selJ.kind==='rx' ? selJ.drug.id : null;
  if (hi && shelfUI.q==='') shelfUI.open[drugById[hi].cat] = true;
  const q = shelfUI.q.trim().toLowerCase();
  const match = d => !q || (d.n+' '+CATS[d.cat].n+' '+d.f+' '+(d.note||'')).toLowerCase().includes(q);
  const keep = d => match(d) && (!shelfUI.lowOnly || d.have/d.q<.3);
  let html='', shown=0;
  for (const ck of Object.keys(CATS)){
    const list = DRUGS.filter(d=>d.cat===ck && keep(d));
    if (!list.length) continue;
    shown += list.length;
    const gl = list.filter(d=>qtyOf(d)>0 && qtyOf(d)/d.q<.3).length;
    const go = list.filter(d=>qtyOf(d)<=0).length;
    const openG = q ? true : shelfUI.open[ck];
    html += `<button class="dgrp" data-grp="${ck}" aria-expanded="${openG}">
      <i style="background:${CATS[ck].c}"></i><span class="gn">${CATS[ck].n}</span>
      <span class="gc">${list.length}${go?`　<b style="color:var(--bad)">${go}空</b>`:''}${gl?`　<b>${gl}低</b>`:''}</span>
      <span class="gx">${openG?'▾':'▸'}</span></button>`;
    if (!openG) continue;
    html += list.map(d=>{
      const v=qtyOf(d), r=v/d.q, cls=v<=0?'out':(r<.3?'low':'');
      const tags=[d.st==='cold'?'冷藏':'', d.st==='ctrl'?'管制':'',
        d.pk?(d.pk.type==='blister'?`排裝 ${d.pk.per}／排`:'罐裝'):''].filter(Boolean).join('・');
      return `<div class="drow ${cls} ${d.counted?'':'unc'} ${d.id===hi?'hi':''}"
        title="${d.n}｜${CATS[d.cat].n}・${d.f}${tags?'・'+tags:''}${d.note?'・'+d.note:''}｜${d.counted?'實際':'帳面'} ${v} / 七日儲備 ${d.q} ${d.u}${d.counted?'':'（尚未盤點，帳面未必準）'}">
        <i style="background:${CATS[d.cat].c}"></i>
        <span class="dn">${d.n}<small>${d.f}${tags?'・'+tags:''}${d.note?'・'+d.note:''}</small></span>
        <span class="dq"><b>${v}</b>/${d.q}</span></div>`;
    }).join('');
  }
  if (!shown) html = `<div class="dempty">沒有符合「${shelfUI.q}」的品項。</div>`;
  put('shelf', html);
  // 換到另一張處方時，把該品項捲到看得見的地方（只做一次，不打斷你自己的捲動）
  if (hi && hi!==shelfUI.lastHi){
    shelfUI.lastHi = hi;
    const el = $('shelf').querySelector('.drow.hi');
    if (el) el.scrollIntoView({block:'center'});
  } else if (!hi) shelfUI.lastHi = null;
}
function renderLog(){
  const el=$('log');
  if (put('log', S.log.slice(-80).map(l=>`<div class="${l.c}"><b>${l.t}</b>${l.m}</div>`).join('')))
    el.scrollTop=el.scrollHeight;
}
function renderDetail(){
  if (S.task){
    const pct=Math.max(0,Math.min(100,(1-S.task.remain/S.task.total)*100));
    if (put('detail',`<div class="pane"><h2>作業中</h2><div class="sub">${S.task.n}</div>
      <div class="note">剩餘 <b>${Math.max(0,S.task.remain).toFixed(1)}</b> 分鐘
        <div style="height:5px;background:#0c1012;border:1px solid var(--line);margin-top:8px">
          <i style="display:block;height:100%;width:${pct.toFixed(0)}%;background:var(--amber)"></i></div></div>
      ${S.running?'<div class="note warn">每一項工作都要時間。趕，就是錯誤的來源。</div>'
        :`<div class="note warn"><b>時間是停的，作業不會前進。</b>
          <div class="btnrow" style="margin-top:8px"><button class="pbtn" data-cmd="resume">繼續</button></div></div>`}
      </div>`)){
      const r=$('detail').querySelector('[data-cmd="resume"]');
      if (r) r.onclick=()=>setSpeed(S.speed||1);
    }
    return;
  }
  const j=S.jobs.find(x=>x.n===S.sel);
  if (!j){ put('detail', idlePane()); return; }
  if (j.kind==='rx') return renderRx(j);
  if (j.kind==='con') return renderCon(j);
  if (j.kind==='edu') return renderEdu(j);
  if (j.kind==='emt'||j.kind==='cbr') return renderEmt(j);
  if (j.kind==='ass') return renderAss(j);
  if (j.kind==='emt2') return renderEmt2(j);
  if (j.kind==='logi') return renderLogi(j);
  if (j.kind==='lang') return renderLang(j);
  if (j.kind==='crowd') return renderCrowd(j);
  if (j.kind==='idn') return renderIdn(j);
  if (j.kind==='help') return renderHelp(j);
}

/* 諮詢與 EMT-2 求援共用同一種版型：情境 → 單選 → 回饋。
   以前是兩份幾乎一樣的程式碼，現在只有一份。 */
function renderChoiceJob(j, cfg){
  const done=j.status==='done';
  let h=`<div class="pane"><h2>${cfg.title}</h2><div class="sub">${cfg.sub}</div>
    <div class="paper" data-t="${cfg.paper}">${cfg.rows}</div>${cfg.pre||''}`;
  if (done){
    const o=j.opts[j.picked];
    h+=`<div class="note ${o.v==='good'?'ok':o.v==='mid'?'warn':''}"
      style="${o.v==='bad'?'border-left-color:var(--bad)':''}">
      <b>${cfg.doneLabel}</b><br>${o.t}<br><br>${o.fb}</div></div>`;
    put('detail',h); return;
  }
  h+=`<div class="acts">${j.opts.map((o,i)=>
    `<button class="opt" data-choice="${i}"><b>${o.t}</b></button>`).join('')}</div>
    <div class="note">${cfg.foot}</div></div>`;
  if (put('detail',h)) $('detail').querySelectorAll('[data-choice]').forEach(btn=>
    btn.onclick=()=>cfg.submit(j, +btn.dataset.choice));
}
function renderCon(j){
  renderChoiceJob(j, {
    title:`諮詢 #${String(j.n).padStart(2,'0')}`,
    sub:`${j.who}（${j.role}）· ${clock(j.issued)}${j.status==='done'?'　·　已回覆':'　·　他在領藥窗口等你'}`,
    paper:'諮詢',
    rows:`<div class="prow"><span>來源</span><b>${j.who}</b></div>
      <div class="prow"><span>問題</span><b class="big" style="font-size:12.5px;line-height:1.5">${j.q}</b></div>
      ${j.ctx?`<div class="prow"><span>你手上的資訊</span><b style="color:var(--ink-dim)">${j.ctx}</b></div>`:''}`,
    pre: j.needCount?`<div class="note ${S.counted?'ok':'warn'}">${S.counted
      ?'你今天已完成盤點，可以給出清單。':'你今天還沒盤點——沒有盤點的人只能給印象，不能給清單。'}</div>`:'',
    doneLabel:'你的回覆', foot:`回覆需要 ${T.con} 分鐘。這段時間佇列不會停。`,
    submit:answerConsult});
}
function renderEmt2(j){
  renderChoiceJob(j, {
    title:j.title,
    sub:`EMT-2 支援　·　${j.who}　·　${zoneById[j.zone].name}　·　${clock(j.issued)}`,

    rows:`<div class="prow"><span>${j.who}</span><b style="color:var(--ink-dim);font-weight:400">「${j.ask}」</b></div>`,

    foot:`你持有 EMT-2：評估、給氧、基本氣道、CPR 與 AED、止血固定、建立靜脈路徑與輸液都在範圍內。
      但「別人抽好的藥」不能直接接手就打，調整輸液速率與給藥仍需醫囑。<br>
      <span style="color:var(--ink-faint)">答應了就要離開藥局幾分鐘。佇列目前 ${pending().length} 項。</span>`,
    submit:answerEmt2});
}

function renderChecklistJob(j, cfg){
  const done=j.status==='done';
  let h=`<div class="pane"><h2>${cfg.title}</h2>
    <div class="sub">${cfg.sub}</div>
    <div class="paper" data-t="${cfg.paper}">${cfg.rows}</div>
    ${cfg.pre||''}`;
  if (done){
    const bad=j.score[1], extra=cfg.doneExtra?cfg.doneExtra(j):'';
    h+=`<div class="note ${bad===0&&j.score[0]>=j.need?'ok':'warn'}"
      style="${(j.score[2]||0)?'border-left-color:var(--bad)':''}">
      ${cfg.doneLabel||'正確做法'} <b>${j.score[0]}</b>　${cfg.badLabel||'錯誤做法'} <b>${bad}</b>${
        (j.score[2]||0)?`　·　<b style="color:var(--bad)">其中 ${j.score[2]} 項涉及身分推測</b>`:''}<br>
      ${j.picked.map(i=>`${j.pts[i].ok?'✓':'✗'} ${j.pts[i].t}`).join('<br>')}</div>
      <div class="note">完整的正確做法：<br>${j.pts.filter(p=>p.ok).map(p=>'・'+p.t).join('<br>')}</div>${extra}</div>`;
    put('detail',h); return;
  }
  h+=`<div class="note">${cfg.hint}</div>
    <div class="acts">${j.pts.map((p,i)=>
      `<label class="chk ${j.picked.includes(i)?'on':''}"><input type="checkbox" data-ck="${i}" ${j.picked.includes(i)?'checked':''}>
        <span>${p.t}</span></label>`).join('')}</div>
    <div class="btnrow"><button class="pbtn" data-cmd="ckgo" ${j.picked.length>=j.need?'':'disabled'}
      style="${j.picked.length>=j.need?'':'opacity:.4;cursor:not-allowed'}">${cfg.go}</button></div></div>`;
  if (put('detail',h)){
    $('detail').querySelector('[data-cmd="ckgo"]').onclick=()=>{
      if (j.picked.length>=j.need) cfg.submit(j); };
  }
}
function renderEdu(j){
  renderChecklistJob(j, {

/* 站內剛好有人的語言對得上的時候，那是今天最實在的一件事。
   幫手是陸續到的，所以每次打開這張單子都重新看一次現場有誰。
   只有在你還沒開始勾選之前會加進清單，加進去之後就固定住。 */
function tryTranslator(j){
  if (j.helperTr || (j.picked&&j.picked.length)) return;
  const want = j.tr||[];
  const tr = S.helpers.find(x=>x.active && !x.away && x.h.lang && want.includes(x.h.lang));
  if (!tr) return;
  j.helperTr = tr.h.name; j.trLang = tr.h.lang;
  j.pts = [{t:`請站內的 ${tr.h.name}（會講${tr.h.lang}）協助通譯，並請通譯者與病人各複誦一次`,ok:true}]
    .concat(j.pts);
  log(`${tr.h.name} 會講${tr.h.lang}——他可以幫這一位。`,'l-key');
  dirty.detail=true;
}
function renderLang(j){
  if (j.status==='pending') tryTranslator(j);
  renderChecklistJob(j, {
    title:`${j.nm}　<span style="font-size:11px;color:var(--ink-faint)">${j.flagTxt}</span>`,
    sub:`${j.who}　·　${j.age}歲${j.sex}　${j.wt} kg　·　領藥窗口　·　${clock(j.issued)}`, paper:'領藥窗口',
    rows:`<div class="prow"><span>情況</span><b style="color:var(--ink-dim);font-weight:400">${j.intro}</b></div>
      <div class="prow"><span>診斷</span><b>${j.dx}</b></div>`,
    pre: (j.helperTr?`<div class="note ok"><b>${j.helperTr}</b> 會講${j.trLang}。
      他就在站內——這一題你不必自己猜。</div>`:'')
      + (j.intro2?`<div class="note warn">有人在問他是哪邊的人。<b>依醫療需求施救、不因身分區別，是不可協商的原則。</b>
      你的紀錄會被看見，也會被引用。</div>`:''),
    hint:`這一題從頭到尾都在你的桌子上。語言不通不會改變你要回答的三個問題：
      <b>他吃過什麼、對什麼過敏、你能不能安全地給他下一劑。</b><br>
      選出你要採取的做法（至少 ${j.need} 項）。`,
    doneLabel:'正確做法', badLabel:'不當做法', go:'開始',
    doneExtra:jj=>jj.coda?`<div class="note" style="border-left-color:var(--amber)">${jj.coda}</div>`:'',
    submit:answerLang});
}

                 ${j.listAt?'<br>依對方的書面需求清單辦理。':'<br><b style="color:var(--warn)">沒有需求清單。</b>'}

                 ${j.picked&&j.picked.some(id=>drugById[id]&&drugById[id].st==='ctrl')

      <br><span style="color:var(--ink-faint)">已勾 <b>${j.picked.length}</b>${give?` / ${ASK_MAX}`:''} 項</span></div>
    ${ASK_GROUPS.map(g=>{
      const items=ASK_ITEMS.filter(it=>it.g===g && (give || !it.sup));
      if (!items.length) return '';
      return `<div class="askg">${g}</div><div class="acts">${items.map(it=>{
        const d=drugById[it.id], v=d?(d.counted?d.have:d.book):null;
        const sk=SUP_KEY[it.id], short=sk&&!S.sup[sk];
        const on=j.picked.includes(it.id);
        const full=!on && give && j.picked.length>=ASK_MAX;
        return `<label class="chk ${on?'on':''}${full?' dim':''}">
          <input type="checkbox" data-lg="${it.id}" ${on?'checked':''} ${full?'disabled':''}>
          <span><b>${it.n}</b>${it.ctrl?' <span class="chip c">管制</span>':''}${it.sup?' <span class="chip">耗材</span>':''}
          <small>${it.why}${d?`　·　目前${d.counted?'實際':'帳面'} ${v} ${it.u}${v<=0?'　<b style="color:var(--bad)">已歸零</b>':(v/d.q<.3?'　<b style="color:var(--warn)">低於三成</b>':'')}`

      }).join('')}</div>`;}).join('')}
    ${!give?`

             <span style="color:var(--ink-faint)">有清單，你才知道自己讓出去的是不是他們真正需要的，也才有依據保留本站的量。</span>`
          : `${j.who||c.who} 沒有帶。他說「上面交代的」「你就給一點」。<br>
             <span style="color:var(--ink-faint)">沒有清單的調撥，日後對不上的時候，說不清楚的是你。</span>`}
        ${(j.hasList||j.askedList)?'':`<div class="btnrow" style="margin-top:8px">
          <button class="gbtn" data-cmd="lglist">要求對方補一張需求清單（${T.reqList} 分鐘）</button></div>`}
      </div>
      <label class="chk ${j.rec?'on':''}" style="margin-top:6px"><input type="checkbox" id="lg-rec" ${j.rec?'checked':''}>
        <span><b>辦理移轉紀錄與雙方簽收</b><small>調撥沒有這一步，帳就永遠對不起來</small></span></label>
      ${j.picked.some(id=>drugById[id]&&drugById[id].st==='ctrl')?`
      <label class="chk ${j.book?'on':''}"><input type="checkbox" id="lg-book" ${j.book?'checked':''}>

    helperBrief(j, b.dataset.hb==='1'));

function stepper(key, val, wide, slim){
  return `<span class="stp">${slim?'':`<button data-st="${key}" data-v="-10">−10</button>`}
    <button data-st="${key}" data-v="-1">−</button>
    <input type="text" inputmode="numeric" data-set="${key}" value="${val}" class="${wide?'w':''}">
    <button data-st="${key}" data-v="1">＋</button>
    ${slim?'':`<button data-st="${key}" data-v="10">＋10</button>`}</span>`;
}

      <select id="subsel">${subList(j)
          .map(x=>`<option value="${x.id}">${x.n}　·　${x.f}　·　餘 ${x.counted?x.have:x.book} ${x.u}</option>`).join('')

      <select id="retreason">${REASONS.map(x=>`<option value="${x.id}">${x.n}　—　${x.d}</option>`).join('')}</select>
      <label style="margin-top:9px">替代建議</label>

      <div class="btnrow" style="margin-top:9px"><button class="pbtn" id="retgo">確認退回</button>
        <button class="gbtn" id="retno">取消</button></div></div></div>`;
  if (put('detail',h)){
    const q=c=>$('detail').querySelector(`[data-cmd="${c}"]`);

    q('ann')&&(q('ann').onclick=()=>doDispense(j,true));
    q('ask')&&(q('ask').onclick=()=>doAsk(j));
    q('part')&&(q('part').onclick=()=>doPartial(j));
    q('subs')&&(q('subs').onclick=()=>{ $('subbox').hidden=false; $('retbox').hidden=true;
      if (MOBILE()) reveal('#subbox'); else $('subbox').scrollIntoView({block:'nearest'}); });
    $('subno')&&($('subno').onclick=()=>{ $('subbox').hidden=true; });
    $('subgo')&&($('subgo').onclick=()=>doSubstitute(j, $('subsel').value,
      $('sub-vo').checked, $('subtxt').value.trim()));
    q('ret')&&(q('ret').onclick=()=>{ $('retbox').hidden=false; $('subbox').hidden=true;
      if (MOBILE()) reveal('#retbox'); else $('retbox').scrollIntoView({block:'nearest'}); });
    $('retno')&&($('retno').onclick=()=>{ $('retbox').hidden=true; });
    $('retgo')&&($('retgo').onclick=()=>doReturn(j,$('retreason').value,$('rettxt').value.trim()));
  }
}
function renderEmt(j){
  const done=j.status==='done';
  const isCbr = j.kind==='cbr';
  let h=`<div class="pane"><h2>${j.title}</h2>
    <div class="sub">${isCbr?'CBRNE 應變':'EMT-2 現場處置'}　·　${zoneById[j.zone]?zoneById[j.zone].name:''}　·　${clock(j.issued)}</div>
    <div class="note emt" ${isCbr?'style="border-left-color:var(--k-cbr)"':''}>${j.intro}</div>
    <div class="step">${j.steps.map((_,i)=>`<i class="${i<j.step?'on':''}"></i>`).join('')}
      <span>步驟 ${Math.min(j.step+1,j.steps.length)} ／ ${j.steps.length}</span></div>`;
  if (done){
    h+=j.res.map(r=>`<div class="note ${r.v==='good'?'ok':r.v==='mid'?'warn':''}"
      style="${r.v==='bad'?'border-left-color:var(--bad)':''}"><b>${r.q}</b><br>
      ${r.v==='good'?'✓':r.v==='mid'?'△':'✗'} ${r.t}<br><br>${r.fb}</div>`).join('')+'</div>';

  }

    style="${j.res[j.res.length-1].v==='bad'?'border-left-color:var(--bad)':''}">${j.res[j.res.length-1].fb}</div>`:'';
  h+=prev+`<div class="paper" data-t="現場"><div class="prow"><span>狀況</span><b>${st.q}</b></div></div>
    <div class="acts">${st.opts.map((o,i)=>`<button class="opt" data-emt="${i}"><b>${o.t}</b></button>`).join('')}</div>
    ${isCbr
      ? `<div class="note" style="border-left-color:var(--k-cbr)">你手上有的：Atropine 1mg/1ml <b>${drugById.atr.have}</b> 支、
          Diazepam <b>${drugById.diaz.have}</b> 支（管制）、Midazolam <b>${drugById.mida.have}</b> 支（管制）。
          <b>本站庫備清單沒有 Pralidoxime（2-PAM），也沒有碘化鉀。</b></div>`
      : `<div class="note">你持有 EMT-2：可執行評估、給氧、基本氣道、CPR 與 AED、止血固定、<b>建立靜脈路徑與輸液</b>。
          進階氣道與未經醫囑或線上醫療指導的藥物給予不在範圍內。</div>`}</div>`;
  if (put('detail',h)) $('detail').querySelectorAll('[data-emt]').forEach(b=>
    b.onclick=()=>isCbr?answerCbrne(j,+b.dataset.emt):answerEmt(j,+b.dataset.emt));
}

/* ---------- 14. 對話框與繫結 ---------- */
function openModal(html,mount){
  $('sheet').innerHTML=html; $('modal').hidden=false;
  S.wasRunning=S.running; S.running=false; syncSpeed();
  if (mount) mount();
  $('sheet').scrollTop=0;
}
function closeModal(resume){
  $('modal').hidden=true;
  if (resume!==false && S.wasRunning && !S.over) S.running=true;
  syncSpeed();
}
function syncSpeed(){
  const map={sp0:0,sp1:1,sp2:2,sp4:4,sp8:8};
  for (const id in map) $(id).setAttribute('aria-pressed',
    (S.running?(S.speed===map[id]&&map[id]!==0):id==='sp0')?'true':'false');
}
function setSpeed(v){ if(v===0) S.running=false; else { S.speed=v; if(!S.over) S.running=true; } syncSpeed(); }
/* 版面斷點：由 layoutClass() 實際量出來，不靠 media query——
   宿主給的版面視窗寬度可能跟螢幕差好幾倍，media query 會整個不成立。 */
const MOBILE = ()=>document.documentElement.classList.contains('narrow');
function layoutClass(){
  const de=document.documentElement;
  const vw = de.clientWidth || window.innerWidth || 0;
  const sw = (window.screen && window.screen.width) || 0;
  const coarse = (window.matchMedia && (matchMedia('(hover:none)').matches
    || matchMedia('(pointer:coarse)').matches)) || ('ontouchstart' in window);
  // 版面視窗比實際螢幕寬 1.6 倍以上，表示宿主沒有套 viewport——以螢幕寬度為準
  let w = vw;
  if (coarse && sw>0 && vw>0 && vw/sw>=1.6) w = sw;
  if (!w) w = 1200;
  const narrow = w<=960;
  const was = de.className;
  de.classList.toggle('narrow', narrow);
  de.classList.toggle('tiny', narrow && w<=430);
  de.classList.toggle('land', narrow && (de.clientHeight||0) < vw);
  return de.className!==was;
}
function setTab(t){
  S.tab=t; document.body.dataset.tab=t;
  document.querySelectorAll('#tabs button').forEach(b=>
    b.setAttribute('aria-pressed', b.dataset.tab===t?'true':'false'));
  if (renderer) onResize();
}
function renderTabs(){
  const p=pending().length;
  const w=$('tb-work'); if (w) w.textContent=p||'';
  const st=$('tb-stock');
  if (st){ const out=DRUGS.filter(d=>(d.counted?d.have:d.book)<=0).length;
    st.textContent=out?out:''; st.style.color=out?'var(--bad)':''; }
  document.body.classList.toggle('busy', !!S.task);
}
function bind(){
  document.body.dataset.tab='work';
  $('tabs').addEventListener('click',e=>{
    const t=e.target.closest('[data-tab]'); if(!t) return; setTab(t.dataset.tab); });
  $('btn-more').onclick=()=>{
    const on=!document.body.classList.contains('more');
    document.body.classList.toggle('more',on);
    $('btn-more').setAttribute('aria-pressed',on?'true':'false'); };
  document.addEventListener('click',e=>{           // 點空白處收起「⋯」
    if (!e.target.closest('#moreset') && !e.target.closest('#btn-more'))
      document.body.classList.remove('more'); }, true);
  [['sp0',0],['sp1',1],['sp2',2],['sp4',4],['sp8',8]].forEach(([id,v])=>$(id).onclick=()=>setSpeed(v));
  $('seedv').textContent=SEED;
  $('btn-seed').onclick=()=>{
    const url=location.origin+location.pathname+'#seed='+SEED;
    if (navigator.clipboard) navigator.clipboard.writeText(url).catch(()=>{});
    log(`本場種子 ${SEED}。同一個種子會生出同一批幫手與同一組事件——連結已複製，可讓整班跑同一場。`,'l-key');
    narrate(`種子 ${SEED}。這一場的人與事，換一個種子就不一樣了。`);
  };
  $('btn-doc').onclick=openDoc;
  $('btn-aar').onclick=()=>{ if(!S.over) openHandover(); else endGame(); };
  $('btn-auto').onclick=()=>{ S.autopause=!S.autopause;
    $('btn-auto').setAttribute('aria-pressed',S.autopause?'true':'false');
    log(S.autopause?'新事件自動暫停：開':'新事件自動暫停：關'); };
  $('btn-bench').onclick=()=>{ player.pos=[BENCH[0],BENCH[1]+2.5]; player.yaw=Math.PI; player.wide=false;
    log('回到調劑檯。'); };
  // 藥品架側欄
  $('stock-rail').onclick=()=>{ shelfUI.collapsed=!shelfUI.collapsed;
    $('stock').classList.toggle('closed',shelfUI.collapsed);
    $('stock-rail').setAttribute('aria-expanded',shelfUI.collapsed?'false':'true');
    onResize(); };
  $('stock-find').oninput=e=>{ shelfUI.q=e.target.value; dirty.stock=true; };
  $('stock-all').onclick=()=>{ Object.keys(CATS).forEach(k=>shelfUI.open[k]=true); dirty.stock=true; };
  $('stock-none').onclick=()=>{ Object.keys(CATS).forEach(k=>shelfUI.open[k]=false); dirty.stock=true; };
  $('stock-lowonly').onchange=e=>{ shelfUI.lowOnly=e.target.checked; dirty.stock=true; };
  $('shelf').addEventListener('click',e=>{
    const g=e.target.closest('[data-grp]'); if(!g) return;
    shelfUI.open[g.dataset.grp]=!shelfUI.open[g.dataset.grp]; dirty.stock=true; uiClock=0; flushUI(); });
  // 右欄的勾選框統一由這一個委派處理。面板重繪不會影響它，
  // 也就不會再發生「重繪把剛勾好的狀態吃掉」這種事。
  $('detail').addEventListener('change', e=>{
    const t=e.target, j=S.jobs.find(x=>x.n===S.sel); if (!j) return;
    const mark=(el,on)=>{ const l=el.closest('.chk')||el.closest('.scopeitem'); if(l) l.classList.toggle('on',on); };
    if (t.dataset.lg!=null){
      const id=t.dataset.lg, k=j.picked.indexOf(id);
      if (t.checked&&k<0){ if (j.mode==='give'&&j.picked.length>=ASK_MAX){ t.checked=false; return; } j.picked.push(id); }
      else if (!t.checked&&k>=0) j.picked.splice(k,1);
      mark(t,t.checked); dirty.detail=true; return;
    }
    if (t.id==='lg-rec'){ j.rec=t.checked; mark(t,t.checked); return; }
    if (t.id==='lg-book'){ j.book=t.checked; mark(t,t.checked); return; }
    if (t.dataset.ck!=null){
      const i=+t.dataset.ck, k=j.picked.indexOf(i);
      if (t.checked&&k<0) j.picked.push(i); else if(!t.checked&&k>=0) j.picked.splice(k,1);
      mark(t,t.checked);
      const g=$('detail').querySelector('[data-cmd="ckgo"]');
      if (g){ const ok=j.picked.length>=j.need;
        g.disabled=!ok; g.style.opacity=ok?'1':'.4'; g.style.cursor=ok?'pointer':'not-allowed'; }
      return;
    }
    if (t.dataset.sc!=null){
      const sc=t.dataset.sc, k=j.scope.indexOf(sc);
      if (t.checked&&k<0) j.scope.push(sc); else if(!t.checked&&k>=0) j.scope.splice(k,1);
      mark(t,t.checked); return;
    }
    if (t.id==='cl-led'){ j.ledger=t.checked; mark(t,t.checked); return; }
    if (t.id==='cl-dual'){
      if (t.checked && S.t>S_MCI.t-2 && S.t<S_MCI.t+40){
        log('現場找不到第二位可核對的人員。','l-warn'); t.checked=false; return; }
      j.dual=t.checked; mark(t,t.checked); return;
    }
  });
  $('qfilter').addEventListener('click',e=>{
    const f=e.target.closest('[data-qf]'); if(!f) return;
    if (f.dataset.qf==='__pend') qFilter.pendOnly=!qFilter.pendOnly;
    else qFilter.kind=f.dataset.qf;
    dirty.q=true; uiClock=0; flushUI();
  });
  document.addEventListener('click',e=>{
    const jb=e.target.closest('[data-j]');
    if (jb){ S.sel=+jb.dataset.j; dirty.q=dirty.detail=dirty.stock=true;
      if (MOBILE()) setTab('act');                 // 手機：點了工作就直接帶你到處置面板
      return; }
    const c=e.target.closest('[data-cmd]'); if (!c) return;
    const cmd=c.dataset.cmd;
    if (cmd==='bgstart') startBg(c.dataset.bgid);
    if (cmd==='rest') startWork('短暫休息',T.rest,()=>{ S.fatigue=Math.max(0,S.fatigue-30);
      log('短暫休息結束。','l-ok'); narrate('你坐了十分鐘。腰還是痠，但視野清楚了一點。'); });
  });
  $('bgbar').addEventListener('click',e=>{
    const ch=e.target.closest('[data-chore]');
    if (ch){
      const rec=S.helpers.find(r=>r.h.id===ch.dataset.chore); if(!rec) return;
      const avail=Object.keys(BGJOBS).filter(k=>
        !((k==='count'&&S.counted)||(k==='ice'&&S.iceReady)||(k==='pack'&&S.packReady)||(k==='tidy'&&S.tidy)));
      openModal(`<h1>交辦給 ${rec.h.name}</h1>
        <p class="kicker">${rec.h.skill}　·　授權範圍：${rec.scope.map(x=>SCOPES[x].n).join('、')||'無'}
          ${rec.briefed?'　·　已完成作業簡介':'　·　<b>未做作業簡介</b>'}</p>
        <div class="note">交出去的雜事他會自己做完，不佔用你的時間。
          但<b>他做出來的結果你不會在旁邊看著</b>——尤其是盤點，數字錯了比沒數更危險。</div>
        ${avail.length?avail.map(k=>{
          const fit=rec.h.ok.includes(k==='pack'?'pack':'count');
          return `<button class="opt ${fit?'':'bad'}" data-give="${k}">
            <b>${BGJOBS[k].n}</b><span>${BGJOBS[k].hint}　·　
            ${fit?'在他的能力範圍內':'<b style="color:var(--bad)">這不是他熟的事</b>'}</span></button>`;}).join('')
          :'<p>目前沒有待辦的雜事。</p>'}
        <div class="btnrow"><button class="gbtn" id="gcancel">算了，我自己來</button></div>`,
        ()=>{ $('sheet').querySelectorAll('[data-give]').forEach(x=>x.onclick=()=>{
              assignChore(rec, x.dataset.give); closeModal(); });
          $('gcancel').onclick=()=>closeModal(); });
      return;
    }
    const b=e.target.closest('[data-bg]'); if(!b||b.disabled) return;
    if (b.dataset.bg==='stop') stopBg(); else startBg(b.dataset.bg);
    dirty.bg=true; uiClock=0; flushUI();
  });
  const kd=(e,v)=>{ const k=e.key.toLowerCase();
    if (['w','a','s','d','q','e'].includes(k)){ player.keys[k]=v; e.preventDefault(); }
    if (k==='v'&&v){ player.wide=!player.wide; e.preventDefault(); }
    if (k===' '&&v){ setSpeed(S.running?0:(S.speed||1)); e.preventDefault(); } };
  window.addEventListener('keydown',e=>kd(e,true));
  window.addEventListener('keyup',e=>kd(e,false));
  // 對話框點一下就換下一句（給讀得快的人；讀得慢的人就讓它自己走）
  $('speech').onclick=()=>{ speech.until=0; uiClock=0; flushUI(); };
  document.querySelectorAll('#dpad button').forEach(b=>{
    const d=b.dataset.d;
    const on=ev=>{ev.preventDefault();player.keys[d]=true;}, off=ev=>{ev.preventDefault();player.keys[d]=false;};
    b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off);
    b.addEventListener('pointerleave',off); b.addEventListener('pointercancel',off);
  });
}
function start(){

}
